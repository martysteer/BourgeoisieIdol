<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Judge - BOURGEOISIE IDOL</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modal.css">
    <script src="openseadragon.min.js"></script>
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
        }

        .story-title {
            font-size: var(--text-body);
            margin-top: 0.5rem;
            color: var(--neon-yellow);
        }

        .page-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .buzz-button {
            width: 80vmin;
            height: 80vmin;
            max-width: 400px;
            max-height: 400px;
            background: linear-gradient(145deg, #ff0000, #cc0000);
            border: 8px solid #800000;
            border-radius: 50%;
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-display);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 15px 30px rgba(255, 0, 0, 0.5),
                        inset 0 -8px 20px rgba(0, 0, 0, 0.3),
                        inset 0 8px 20px rgba(255, 255, 255, 0.2);
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.3;
        }

        .buzz-button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.5),
                        inset 0 -4px 10px rgba(0, 0, 0, 0.3),
                        inset 0 4px 10px rgba(255, 255, 255, 0.2);
        }

        .buzz-button:disabled {
            background: #333;
            border-color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        .buzz-button .buzzed {
            font-size: 6rem;
            color: #f00;
            animation: buzzAnim 0.5s ease-out;
        }

        @keyframes buzzAnim {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .judge-status {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
        }

        .buzz-count {
            font-size: var(--text-caption);
            opacity: 0.7;
            color: var(--neon-green);
        }

        .buzz-count.active {
            opacity: 1;
            color: var(--neon-yellow);
        }

        .waiting {
            font-size: var(--text-body);
            text-align: center;
            opacity: 0.7;
        }

        .header-timer.timer-force-hidden {
            display: none !important;
        }

        /* Canvas mode layout */
        #osdViewerContainer {
            display: none;
            width: 100%;
            flex: 1;
            flex-direction: column;
            position: relative;
        }

        #canvasLabel {
            font-size: var(--text-caption);
            color: var(--neon-yellow);
            text-align: center;
            padding: 0.5rem 0;
            display: none;
        }

        #osdViewer {
            width: 100%;
            flex: 1;
            min-height: 200px;
            background: var(--black);
        }

        #textOverlay {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            max-height: 50%;
            overflow-y: auto;
            pointer-events: none;
            z-index: 10;
        }

        #metadataParagraphs {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .overlay-paragraph {
            background: rgba(0, 0, 0, 0.8);
            padding: 0.75rem 1rem;
            font-size: 1rem;
            line-height: 1.5;
            color: #fff;
        }

        /* Buzz button container — always in DOM */
        #buzzContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        /* Canvas mode: floating compact buzz */
        main.canvas-mode #buzzContainer {
            position: fixed;
            top: 5rem;
            right: 1rem;
            z-index: 500;
            gap: 0.25rem;
        }

        main.canvas-mode .buzz-button {
            width: 80px;
            height: 80px;
            max-width: 80px;
            max-height: 80px;
            font-size: var(--text-caption);
        }

        main.canvas-mode .buzz-button .buzzed {
            font-size: 2rem;
        }

        main.canvas-mode .buzz-count {
            font-size: 0.5rem;
        }

        main.canvas-mode .story-title {
            display: none;
        }

        main.canvas-mode {
            padding: 0;
        }

        main.canvas-mode #osdViewerContainer {
            display: flex;
            flex: 1;
        }

        main.canvas-mode .waiting {
            display: none;
        }

        main:not(.canvas-mode) #osdViewerContainer {
            display: none !important;
        }
    </style>
</head>
<body class="page-locked">
    <div id="countdown-container" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:1000;"></div>

    <header class="page-header">
        <div class="header-left">
            <div class="page-label">JUDGING</div>
            <div class="header-info">
                <span id="code">----</span> |
                <span id="itemCount">0</span> items |
                <span id="judgeCount">0</span> judges |
                <span id="audienceCount">0</span> audience
            </div>
        </div>
        <div class="header-timer" id="headerTimer" style="display:none;">0:00.0</div>
        <div class="header-context waiting" id="judgeNum" onclick="openNameEditor()" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;">Judge -</div>
    </header>

    <main class="page-content" id="main" role="main">
        <div class="story-title" id="itemTitle" aria-live="polite"></div>
        <div id="osdViewerContainer">
            <div id="canvasLabel"></div>
            <div id="osdViewer">
                <div id="osdPlaceholder" style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--neon-green);opacity:0.4;font-size:var(--text-body);text-align:center;">Canvas area</div>
            </div>
            <div id="textOverlay">
                <div id="metadataParagraphs" aria-live="polite" aria-relevant="additions"></div>
            </div>
        </div>
        <div id="buzzContainer">
            <button class="buzz-button" id="buzzButton" onclick="buzz()" aria-label="Buzz out the reader" disabled>BUZZ</button>
            <div class="buzz-count" id="buzzCountDisplay" aria-live="polite">0 of 0 buzzed</div>
        </div>
        <div class="judge-status" id="judgeStatus"></div>
        <div class="waiting" id="waitingMessage">Waiting for round to start...</div>
    </main>

    <footer class="page-footer">
        <div class="judge-panels" id="judgePanels"></div>
    </footer>

    <!-- Name Editor Modal -->
    <div class="modal-overlay" id="nameModalOverlay">
        <div class="modal-box">
            <div class="modal-message">Who do you think you are?</div>
            <div style="padding:1rem 0;">
                <input type="text" id="nameInput" maxlength="20" style="width:100%;font-family:'Press Start 2P',cursive;font-size:var(--text-caption);" placeholder="Your name">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn" id="nameSaveBtn">SAVE</button>
                <button class="modal-btn cancel" id="nameCancelBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="sounds.js"></script>
    <script>
        const params = getUrlParams();
        const client = new SpecIdolClient();
        let timer = null;
        let countdown = null;
        let buzzed = false;
        let timerDuration = 120;
        let myJudgeId = null;
        let myJudgeName = null;
        let connectedJudges = [];  // [{id, name}, ...]

        // localStorage: read saved name (2hr expiry)
        const TWO_HOURS = 2 * 60 * 60 * 1000;
        function getSavedName() {
            try {
                const stored = JSON.parse(localStorage.getItem('specidol_judge_name'));
                if (stored && (Date.now() - stored.timestamp) < TWO_HOURS) {
                    return stored.name;
                }
                localStorage.removeItem('specidol_judge_name');
            } catch (e) {}
            return null;
        }
        function saveName(name) {
            localStorage.setItem('specidol_judge_name', JSON.stringify({
                name: name,
                timestamp: Date.now()
            }));
        }

        const savedName = getSavedName();

        let osdViewer = null;
        let canvasMode = false;

        function osdIcon(svg) {
            return 'data:image/svg+xml,' + encodeURIComponent(
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">${svg}</svg>`
            );
        }

        const OSD_NAV_IMAGES = {
            zoomIn: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#0f0" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#0f0" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#0f0" stroke-width="3"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#0f0" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#0f0" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#0f0" stroke-width="3"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#0f0" stroke="#0f0" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#1a1a1a" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#1a1a1a" stroke-width="3"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#f00" stroke="#0f0" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#fff" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#fff" stroke-width="3"/>')
            },
            zoomOut: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#0f0" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#0f0" stroke-width="3"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#0f0" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#0f0" stroke-width="3"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#0f0" stroke="#0f0" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#1a1a1a" stroke-width="3"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#f00" stroke="#0f0" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#fff" stroke-width="3"/>')
            },
            home: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#0f0" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#0f0" stroke-width="2"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#0f0" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#0f0" stroke-width="2"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#0f0" stroke="#0f0" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#1a1a1a" stroke-width="2"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#f00" stroke="#0f0" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#fff" stroke-width="2"/>')
            },
            fullpage: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#0f0" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#0f0" stroke-width="2"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#0f0" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#0f0" stroke-width="2"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#0f0" stroke="#0f0" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#1a1a1a" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#1a1a1a" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#1a1a1a" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#1a1a1a" stroke-width="2"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#f00" stroke="#0f0" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#fff" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#fff" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#fff" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#fff" stroke-width="2"/>')
            }
        };

        function getTileSource(canvas) {
            if (canvas.service_url) return canvas.service_url + '/info.json';
            return { type: 'image', url: canvas.image_url };
        }

        function initOsdViewer(canvas) {
            destroyOsdViewer();
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            osdViewer = OpenSeadragon({
                element: document.getElementById('osdViewer'),
                tileSources: getTileSource(canvas),
                showNavigator: false,
                showNavigationControl: true,
                gestureSettingsMouse: { scrollToZoom: true },
                animationTime: prefersReducedMotion ? 0 : 1.2,
                springStiffness: prefersReducedMotion ? 100 : 6.5,
                prefixUrl: '',
                navImages: OSD_NAV_IMAGES
            });
        }

        function destroyOsdViewer() {
            if (osdViewer) { osdViewer.destroy(); osdViewer = null; }
        }

        function showCanvasLabel(label) {
            const el = document.getElementById('canvasLabel');
            if (!el) return;
            if (label) { el.textContent = label; el.style.display = 'block'; }
            else { el.style.display = 'none'; }
        }

        function applyCanvasMode() {
            const main = document.getElementById('main');
            const placeholder = document.getElementById('osdPlaceholder');
            if (canvasMode) {
                main.classList.add('canvas-mode');
                if (placeholder) placeholder.style.display = osdViewer ? 'none' : 'flex';
            } else {
                main.classList.remove('canvas-mode');
            }
        }

        function appendOverlayParagraph(text) {
            const container = document.getElementById('metadataParagraphs');
            const div = document.createElement('div');
            div.className = 'overlay-paragraph text-line';
            div.textContent = text;
            container.appendChild(div);

            const overlay = document.getElementById('textOverlay');
            setTimeout(() => {
                overlay.scrollTop = overlay.scrollHeight;
            }, 100);
        }

        client.connect();

        client.onConnect = () => {
            client.joinSession(params.code, 'judge', null, savedName);
        };

        client.on('session_state', (data) => {
            if (data.server_time) updateClockOffset(data.server_time);
            if (data.config && data.config.timer_duration) {
                timerDuration = data.config.timer_duration;
            }
            // Update judge info from server
            if (data.client_info && data.client_info.judge_id) {
                myJudgeId = data.client_info.judge_id;
                document.getElementById('code').textContent = data.code || '----';
            }
            if (data.items) {
                document.getElementById('itemCount').textContent = data.items.length;
            }
            // Set initial timer visibility
            if (data.timer_visible === false) {
                document.getElementById('headerTimer').classList.add('timer-force-hidden');
            }
            // Set initial canvas mode
            if (data.canvas_visible === true) {
                canvasMode = true;
            }
            // Update connected judges and own name
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                const me = connectedJudges.find(j => j.id === myJudgeId);
                if (me) {
                    myJudgeName = me.name;
                    const el = document.getElementById('judgeNum');
                    el.textContent = myJudgeName;
                    el.classList.remove('waiting');
                }
                updateJudgeCount();
                renderJudgePanels();
            }
            const round = data.current_round;
            if (round.status === 'running' || round.status === 'paused') {
                startRound(round);
                // Replay existing buzzes
                if (round.buzzes) {
                    round.buzzes.forEach(b => {
                        updateJudgeStatus(b.judge_id);
                        if (b.judge_id === myJudgeId) {
                            buzzed = true;
                            const button = document.getElementById('buzzButton');
                            if (button) {
                                button.disabled = true;
                                button.innerHTML = '<div class="buzzed">✕</div>';
                            }
                        }
                    });
                }
                if (round.status === 'paused') {
                    if (timer) timer.pause();
                    const button = document.getElementById('buzzButton');
                    if (button && !buzzed) {
                        button.disabled = true;
                    }
                }
            } else if (round.status === 'defeat' || round.status === 'victory') {
                startRound(round);
                if (round.buzzes) {
                    round.buzzes.forEach(b => updateJudgeStatus(b.judge_id));
                }
                if (timer) timer.stop();
            }
        });

        client.on('toggle_timer_visibility', (data) => {
            const timerEl = document.getElementById('headerTimer');
            if (data.visible) {
                timerEl.classList.remove('timer-force-hidden');
            } else {
                timerEl.classList.add('timer-force-hidden');
            }
        });

        client.on('toggle_canvas', (data) => {
            canvasMode = data.visible;
            applyCanvasMode();
        });

        client.on('countdown_start', (data) => {
            // Reset judge state fully
            buzzed = false;
            if (timer) timer.stop();
            if (countdown) countdown.cancel();

            // Show title
            document.getElementById('itemTitle').textContent = data.item_title || '';

            // Hide waiting message
            document.getElementById('waitingMessage').style.display = 'none';

            // Reset buzz button
            const buzzButton = document.getElementById('buzzButton');
            buzzButton.disabled = true;
            buzzButton.innerHTML = 'BUZZ';

            // Update buzz count
            document.getElementById('buzzCountDisplay').textContent = `0 of ${connectedJudges.length} buzzed`;

            // Clear overlay paragraphs
            document.getElementById('metadataParagraphs').innerHTML = '';

            // Init OSD if canvases present
            const hasCanvases = data.canvases && data.canvases.length > 0;
            if (hasCanvases) {
                const canvas = data.canvases[0];
                initOsdViewer(canvas);
                showCanvasLabel(canvas.label);
            }
            applyCanvasMode();

            renderJudgePanels(false);

            // Show header timer (reset to 0)
            const headerTimer = document.getElementById('headerTimer');
            headerTimer.textContent = '0:00.0';
            headerTimer.style.display = 'flex';

            // Start countdown, then activate
            countdown = new Countdown('countdown-container', () => {
                if (!buzzed) buzzButton.disabled = false;

                if (!timer || !timer.intervalId) {
                    timer = new Timer(
                        Infinity,
                        (elapsed) => {
                            document.getElementById('headerTimer').textContent = formatTime(elapsed);
                        }
                    );
                    timer.startTime = Date.now() / 1000;
                    timer.tick();
                    timer.intervalId = setInterval(() => timer.tick(), 100);
                }
            });
            countdown.start();
        });

        client.on('round_started', (data) => {
            if (data.server_time) updateClockOffset(data.server_time);

            // Set up title and OSD if not already done by countdown_start
            const titleEl = document.getElementById('itemTitle');
            if (!titleEl.textContent) {
                titleEl.textContent = data.title || '';
                document.getElementById('waitingMessage').style.display = 'none';

                const hasCanvases = data.canvases && data.canvases.length > 0;
                if (hasCanvases) {
                    const canvas = data.canvases[data.canvas_index || 0];
                    if (canvas) {
                        initOsdViewer(canvas);
                        showCanvasLabel(canvas.label);
                    }
                }
                applyCanvasMode();
                renderJudgePanels(false);
            }

            // Enable button if not already buzzed
            const buzzButton = document.getElementById('buzzButton');
            if (!buzzed) buzzButton.disabled = false;

            // Update buzz count
            document.getElementById('buzzCountDisplay').textContent = `0 of ${connectedJudges.length} buzzed`;

            // Start server-synced timer
            const headerTimer = document.getElementById('headerTimer');
            headerTimer.style.display = 'flex';
            if (timer) timer.stop();
            timer = new Timer(
                timerDuration,
                (elapsed) => {
                    headerTimer.textContent = formatTime(elapsed);
                },
                () => {
                    if (typeof playVictoryFanfare === 'function') playVictoryFanfare();
                }
            );
            timer.start(data.start_time || (Date.now() / 1000));
        });

        client.on('paused', (data) => {
            if (timer) timer.pause();
            const button = document.getElementById('buzzButton');
            if (button && !buzzed) {
                button.disabled = true;
            }
        });

        client.on('resumed', (data) => {
            if (timer) timer.resume(data.timestamp - data.elapsed);
            const button = document.getElementById('buzzButton');
            if (button && !buzzed) {
                button.disabled = false;
            }
        });

        client.on('text_advanced', (data) => {
            if (canvasMode && osdViewer) {
                appendOverlayParagraph(data.paragraph || data.line);
            }
            // In text mode, judges don't display text paragraphs
        });

        client.on('canvas_advanced', (data) => {
            if (data.canvas) {
                showCanvasLabel(data.canvas.label);
                if (osdViewer) {
                    osdViewer.open(getTileSource(data.canvas));
                } else {
                    initOsdViewer(data.canvas);
                }
            }
        });

        client.on('speed_changed', (data) => {
            // Speed doesn't affect judge view, but we track it
        });

        client.on('buzzed', (data) => {
            updateJudgeStatus(data.judge_id);

            // Play buzz sound
            if (typeof playBuzz === 'function' && client.judgeSounds) {
                const soundIndex = client.judgeSounds[data.judge_id];
                if (soundIndex !== undefined) {
                    playBuzz(soundIndex, data.buzz_count || 1);
                }
            }

            // Check if all judges buzzed (final combo)
            if (client.judgeSounds) {
                const totalJudges = connectedJudges.length;
                if (data.buzz_count >= totalJudges && totalJudges > 0) {
                    setTimeout(() => {
                        if (typeof playFinalCombo === 'function') {
                            playFinalCombo(Object.values(client.judgeSounds));
                        }
                    }, 900);
                }
            }
        });

        client.on('round_ended', (data) => {
            if (timer) timer.stop();
            if (countdown) countdown.cancel();
            // Disable button but keep buzzed state visible until round_reset
            const button = document.getElementById('buzzButton');
            if (button) {
                button.disabled = true;
            }
        });

        client.on('round_reset', () => {
            resetView();
        });

        client.on('ejected', async (data) => {
            await customAlert(data.message || 'You have been ejected from the session');
            window.location.href = 'index.html';
        });

        client.on('session_deleted', async (data) => {
            await customAlert(data.message || 'Session has been deleted');
            window.location.href = 'index.html';
        });

        client.on('judge_joined', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                updateJudgeCount();
                renderJudgePanels();
            }
        });

        client.on('judge_left', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                updateJudgeCount();
                renderJudgePanels();
            }
        });

        client.on('judge_name_changed', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
            }
            if (data.judge_id === myJudgeId) {
                myJudgeName = data.name;
                const el = document.getElementById('judgeNum');
                el.textContent = myJudgeName;
                el.classList.remove('waiting');
            }
            renderJudgePanels();
        });

        client.on('audience_joined', (data) => {
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
        });

        client.on('audience_left', (data) => {
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
        });

        client.on('item_added', (data) => {
            const el = document.getElementById('itemCount');
            el.textContent = (parseInt(el.textContent) || 0) + 1;
        });

        client.on('item_removed', (data) => {
            const el = document.getElementById('itemCount');
            el.textContent = Math.max(0, (parseInt(el.textContent) || 0) - 1);
        });

        client.on('error', async (data) => {
            if (data.message === 'Invalid session code') {
                await customAlert('Session no longer exists. Returning to home.');
                window.location.href = 'index.html';
            }
        });

        function startRound(roundData) {
            buzzed = false;

            // Show title
            document.getElementById('itemTitle').textContent = roundData.title || '';

            // Hide waiting message
            document.getElementById('waitingMessage').style.display = 'none';

            // Reset and enable buzz button
            const buzzButton = document.getElementById('buzzButton');
            buzzButton.disabled = false;
            buzzButton.innerHTML = 'BUZZ';

            // Update buzz count
            document.getElementById('buzzCountDisplay').textContent = `0 of ${connectedJudges.length} buzzed`;

            // Clear overlay paragraphs
            document.getElementById('metadataParagraphs').innerHTML = '';

            // Init OSD if canvases present
            const hasCanvases = roundData.canvases && roundData.canvases.length > 0;
            if (hasCanvases) {
                const canvas = roundData.canvases[roundData.canvas_index || 0];
                if (canvas) {
                    initOsdViewer(canvas);
                    showCanvasLabel(canvas.label);
                }
            }
            applyCanvasMode();

            renderJudgePanels(false);

            // Show header timer
            const headerTimer = document.getElementById('headerTimer');
            headerTimer.style.display = 'flex';

            if (timer) timer.stop();
            timer = new Timer(
                Infinity,
                (elapsed) => {
                    document.getElementById('headerTimer').textContent = formatTime(elapsed);
                }
            );
            timer.start(roundData.start_time);
        }

        function buzz() {
            if (buzzed) return;
            buzzed = true;

            const button = document.getElementById('buzzButton');
            button.disabled = true;
            button.innerHTML = '<div class="buzzed">✕</div>';

            client.buzz(myJudgeId);
        }

        function renderJudgePanels(preserveBuzzed = true) {
            renderJudgePanelCells('judgePanels', connectedJudges, preserveBuzzed);
            updateBuzzCount();
        }

        function updateJudgeCount() {
            const countEl = document.getElementById('judgeCount');
            if (countEl) {
                countEl.textContent = connectedJudges.length;
            }
        }

        function updateBuzzCount() {
            const buzzCountEl = document.getElementById('buzzCountDisplay');
            if (!buzzCountEl) return;

            const buzzedCount = document.querySelectorAll('.judge-cell.buzzed').length;
            const totalCount = connectedJudges.length;

            buzzCountEl.textContent = `${buzzedCount} of ${totalCount} buzzed`;

            if (buzzedCount > 0) {
                buzzCountEl.classList.add('active');
            }
        }

        function updateJudgeStatus(judgeId) {
            const cell = document.querySelector(`.judge-cell[data-judge="${judgeId}"]`);
            if (cell) {
                cell.classList.add('buzzed');
                updateBuzzCount();
            }
        }

        function resetView() {
            if (timer) timer.stop();
            if (countdown) countdown.cancel();
            destroyOsdViewer();
            buzzed = false;
            canvasMode = false;

            // Reset title
            document.getElementById('itemTitle').textContent = '';

            // Show waiting message
            document.getElementById('waitingMessage').style.display = '';

            // Reset buzz button
            const buzzButton = document.getElementById('buzzButton');
            buzzButton.disabled = true;
            buzzButton.innerHTML = 'BUZZ';

            // Clear overlay paragraphs
            document.getElementById('metadataParagraphs').innerHTML = '';

            // Remove canvas mode
            document.getElementById('main').classList.remove('canvas-mode');

            // Hide timer
            document.getElementById('headerTimer').style.display = 'none';

            // Clear buzzed state on judge panels
            document.querySelectorAll('.judge-cell').forEach(cell => {
                cell.classList.remove('buzzed');
            });
        }

        // Name editor modal
        function openNameEditor() {
            const overlay = document.getElementById('nameModalOverlay');
            const input = document.getElementById('nameInput');
            input.value = myJudgeName || '';
            overlay.classList.add('active');
            input.focus();
        }

        document.getElementById('nameSaveBtn').addEventListener('click', () => {
            const name = document.getElementById('nameInput').value.trim().slice(0, 20);
            if (name) {
                myJudgeName = name;
                saveName(name);
                client.setJudgeName(name);
                const el = document.getElementById('judgeNum');
                el.textContent = name;
                el.classList.remove('waiting');
            }
            document.getElementById('nameModalOverlay').classList.remove('active');
        });

        document.getElementById('nameCancelBtn').addEventListener('click', () => {
            document.getElementById('nameModalOverlay').classList.remove('active');
        });

        // Allow Enter to save, Escape to cancel
        document.getElementById('nameInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('nameSaveBtn').click();
            if (e.key === 'Escape') document.getElementById('nameCancelBtn').click();
        });
    </script>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-buttons">
                <button class="modal-btn" id="modalOk">OK</button>
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="modal.js"></script>
</body>
</html>
