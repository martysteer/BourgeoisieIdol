<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Judge - SPECULATIVE IDOL</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modal.css">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
        }

        .story-title {
            font-size: var(--text-body);
            margin-top: 0.5rem;
            color: var(--neon-yellow);
        }

        .page-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .buzz-button {
            width: 80vmin;
            height: 80vmin;
            max-width: 400px;
            max-height: 400px;
            background: linear-gradient(145deg, #ff0000, #cc0000);
            border: 8px solid #800000;
            border-radius: 50%;
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-display);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 15px 30px rgba(255, 0, 0, 0.5),
                        inset 0 -8px 20px rgba(0, 0, 0, 0.3),
                        inset 0 8px 20px rgba(255, 255, 255, 0.2);
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.3;
        }

        .buzz-button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.5),
                        inset 0 -4px 10px rgba(0, 0, 0, 0.3),
                        inset 0 4px 10px rgba(255, 255, 255, 0.2);
        }

        .buzz-button:disabled {
            background: #333;
            border-color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        .buzz-button .buzzed {
            font-size: 6rem;
            color: #f00;
            animation: buzzAnim 0.5s ease-out;
        }

        @keyframes buzzAnim {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .judge-status {
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: center;
        }

        .buzz-count {
            font-size: var(--text-caption);
            opacity: 0.7;
            color: var(--neon-green);
        }

        .buzz-count.active {
            opacity: 1;
            color: var(--neon-yellow);
        }

        .waiting {
            font-size: var(--text-body);
            text-align: center;
            opacity: 0.7;
        }

        .header-timer.timer-force-hidden {
            display: none !important;
        }
    </style>
</head>
<body class="page-locked">
    <div id="countdown-container" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:1000;"></div>

    <header class="page-header">
        <div class="header-left">
            <div class="page-label">JUDGING</div>
            <div class="header-info">
                <span id="code">----</span> |
                <span id="storyCount">0</span> stories |
                <span id="judgeCount">0</span> judges |
                <span id="audienceCount">0</span> audience
            </div>
        </div>
        <div class="header-timer" id="headerTimer" style="display:none;">0:00.0</div>
        <div class="header-context waiting" id="judgeNum" onclick="openNameEditor()" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;">Judge -</div>
    </header>

    <main class="page-content" id="main" role="main">
        <div class="story-title" id="storyTitle" aria-live="polite"></div>
        <div class="waiting">Waiting for round to start...</div>
    </main>

    <footer class="page-footer">
        <div class="judge-panels" id="judgePanels"></div>
    </footer>

    <!-- Name Editor Modal -->
    <div class="modal-overlay" id="nameModalOverlay">
        <div class="modal-box">
            <div class="modal-message">Who do you think you are?</div>
            <div style="padding:1rem 0;">
                <input type="text" id="nameInput" maxlength="20" style="width:100%;font-family:'Press Start 2P',cursive;font-size:var(--text-caption);" placeholder="Your name">
            </div>
            <div class="modal-buttons">
                <button class="modal-btn" id="nameSaveBtn">SAVE</button>
                <button class="modal-btn cancel" id="nameCancelBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="sounds.js"></script>
    <script>
        const params = getUrlParams();
        const client = new SpecIdolClient();
        let timer = null;
        let countdown = null;
        let buzzed = false;
        let timerDuration = 120;
        let myJudgeId = null;
        let myJudgeName = null;
        let connectedJudges = [];  // [{id, name}, ...]

        // localStorage: read saved name (2hr expiry)
        const TWO_HOURS = 2 * 60 * 60 * 1000;
        function getSavedName() {
            try {
                const stored = JSON.parse(localStorage.getItem('specidol_judge_name'));
                if (stored && (Date.now() - stored.timestamp) < TWO_HOURS) {
                    return stored.name;
                }
                localStorage.removeItem('specidol_judge_name');
            } catch (e) {}
            return null;
        }
        function saveName(name) {
            localStorage.setItem('specidol_judge_name', JSON.stringify({
                name: name,
                timestamp: Date.now()
            }));
        }

        const savedName = getSavedName();

        client.connect();

        client.onConnect = () => {
            client.joinSession(params.code, 'judge', null, savedName);
        };

        client.on('session_state', (data) => {
            if (data.server_time) updateClockOffset(data.server_time);
            if (data.config && data.config.timer_duration) {
                timerDuration = data.config.timer_duration;
            }
            // Update judge info from server
            if (data.client_info && data.client_info.judge_id) {
                myJudgeId = data.client_info.judge_id;
                document.getElementById('code').textContent = data.code || '----';
            }
            if (data.stories) {
                document.getElementById('storyCount').textContent = data.stories.length;
            }
            // Set initial timer visibility
            if (data.timer_visible === false) {
                document.getElementById('headerTimer').classList.add('timer-force-hidden');
            }
            // Update connected judges and own name
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                const me = connectedJudges.find(j => j.id === myJudgeId);
                if (me) {
                    myJudgeName = me.name;
                    const el = document.getElementById('judgeNum');
                    el.textContent = myJudgeName;
                    el.classList.remove('waiting');
                }
                updateJudgeCount();
                renderJudgePanels();
            }
            const round = data.current_round;
            if (round.status === 'running' || round.status === 'paused') {
                startRound(round);
                // Replay existing buzzes
                if (round.buzzes) {
                    round.buzzes.forEach(b => {
                        updateJudgeStatus(b.judge_id);
                        if (b.judge_id === myJudgeId) {
                            buzzed = true;
                            const button = document.getElementById('buzzButton');
                            if (button) {
                                button.disabled = true;
                                button.innerHTML = '<div class="buzzed">✕</div>';
                            }
                        }
                    });
                }
                if (round.status === 'paused') {
                    if (timer) timer.pause();
                    const button = document.getElementById('buzzButton');
                    if (button && !buzzed) {
                        button.disabled = true;
                    }
                }
            } else if (round.status === 'defeat' || round.status === 'victory') {
                startRound(round);
                if (round.buzzes) {
                    round.buzzes.forEach(b => updateJudgeStatus(b.judge_id));
                }
                if (timer) timer.stop();
            }
        });

        client.on('toggle_timer_visibility', (data) => {
            const timerEl = document.getElementById('headerTimer');
            if (data.visible) {
                timerEl.classList.remove('timer-force-hidden');
            } else {
                timerEl.classList.add('timer-force-hidden');
            }
        });

        client.on('countdown_start', (data) => {
            // Reset judge state fully
            buzzed = false;
            if (timer) timer.stop();
            if (countdown) countdown.cancel();

            const main = document.getElementById('main');
            main.innerHTML = `
                <div class="story-title" id="storyTitle" aria-live="polite">${data.story_title || ''}</div>
                <button class="buzz-button" id="buzzButton" onclick="buzz()" aria-label="Buzz out the reader" disabled>
                    BUZZ
                </button>
                <div class="judge-status" id="judgeStatus">
                    <div class="buzz-count" id="buzzCountDisplay" aria-live="polite">0 of ${connectedJudges.length} buzzed</div>
                </div>
            `;
            renderJudgePanels(false);

            // Show header timer (reset to 0)
            const headerTimer = document.getElementById('headerTimer');
            headerTimer.textContent = '0:00.0';
            headerTimer.style.display = 'flex';

            // Start countdown, then activate
            countdown = new Countdown('countdown-container', () => {
                // Countdown complete — activate buzz button, start timer
                // (only if round_started hasn't already done so)
                const button = document.getElementById('buzzButton');
                if (button && !buzzed) button.disabled = false;

                if (!timer || !timer.intervalId) {
                    timer = new Timer(
                        Infinity,
                        (elapsed) => {
                            document.getElementById('headerTimer').textContent = formatTime(elapsed);
                        }
                    );
                    timer.startTime = Date.now() / 1000;
                    timer.tick();
                    timer.intervalId = setInterval(() => timer.tick(), 100);
                }
            });
            countdown.start();
        });

        client.on('round_started', (data) => {
            if (data.server_time) updateClockOffset(data.server_time);

            // If buzz button exists (from countdown_start), just sync timer
            const existingBtn = document.getElementById('buzzButton');
            if (existingBtn) {
                // Enable button if not already buzzed
                if (!buzzed) existingBtn.disabled = false;
                // Start server-synced timer (supersedes countdown timer)
                if (timer) timer.stop();
                timer = new Timer(
                    timerDuration,
                    (elapsed) => {
                        document.getElementById('headerTimer').textContent = formatTime(elapsed);
                    },
                    () => {
                        if (typeof playVictoryFanfare === 'function') playVictoryFanfare();
                    }
                );
                timer.start(data.start_time || (Date.now() / 1000));
            } else {
                // Late join — full setup
                startRound(data);
            }
        });

        client.on('paused', (data) => {
            if (timer) timer.pause();
            const button = document.getElementById('buzzButton');
            if (button && !buzzed) {
                button.disabled = true;
            }
        });

        client.on('resumed', (data) => {
            if (timer) timer.resume(data.timestamp - data.elapsed);
            const button = document.getElementById('buzzButton');
            if (button && !buzzed) {
                button.disabled = false;
            }
        });

        client.on('text_advanced', (data) => {
            // Judges don't display text, but handle event to suppress console warning
        });

        client.on('speed_changed', (data) => {
            // Speed doesn't affect judge view, but we track it
        });

        client.on('buzzed', (data) => {
            updateJudgeStatus(data.judge_id);

            // Play buzz sound
            if (typeof playBuzz === 'function' && client.judgeSounds) {
                const soundIndex = client.judgeSounds[data.judge_id];
                if (soundIndex !== undefined) {
                    playBuzz(soundIndex, data.buzz_count || 1);
                }
            }

            // Check if all judges buzzed (final combo)
            if (client.judgeSounds) {
                const totalJudges = connectedJudges.length;
                if (data.buzz_count >= totalJudges && totalJudges > 0) {
                    setTimeout(() => {
                        if (typeof playFinalCombo === 'function') {
                            playFinalCombo(Object.values(client.judgeSounds));
                        }
                    }, 900);
                }
            }
        });

        client.on('round_ended', (data) => {
            if (timer) timer.stop();
            if (countdown) countdown.cancel();
            // Disable button but keep buzzed state visible until round_reset
            const button = document.getElementById('buzzButton');
            if (button) {
                button.disabled = true;
            }
        });

        client.on('round_reset', () => {
            resetView();
        });

        client.on('ejected', async (data) => {
            await customAlert(data.message || 'You have been ejected from the session');
            window.location.href = 'index.html';
        });

        client.on('session_deleted', async (data) => {
            await customAlert(data.message || 'Session has been deleted');
            window.location.href = 'index.html';
        });

        client.on('judge_joined', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                updateJudgeCount();
                renderJudgePanels();
            }
        });

        client.on('judge_left', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                updateJudgeCount();
                renderJudgePanels();
            }
        });

        client.on('judge_name_changed', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
            }
            if (data.judge_id === myJudgeId) {
                myJudgeName = data.name;
                const el = document.getElementById('judgeNum');
                el.textContent = myJudgeName;
                el.classList.remove('waiting');
            }
            renderJudgePanels();
        });

        client.on('audience_joined', (data) => {
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
        });

        client.on('audience_left', (data) => {
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
        });

        client.on('story_added', (data) => {
            const el = document.getElementById('storyCount');
            el.textContent = (parseInt(el.textContent) || 0) + 1;
        });

        client.on('story_removed', (data) => {
            const el = document.getElementById('storyCount');
            el.textContent = Math.max(0, (parseInt(el.textContent) || 0) - 1);
        });

        client.on('error', async (data) => {
            if (data.message === 'Invalid session code') {
                await customAlert('Session no longer exists. Returning to home.');
                window.location.href = 'index.html';
            }
        });

        function startRound(roundData) {
            buzzed = false;
            const main = document.getElementById('main');
            main.innerHTML = `
                <div class="story-title" id="storyTitle" aria-live="polite">${roundData.title || ''}</div>
                <button class="buzz-button" id="buzzButton" onclick="buzz()" aria-label="Buzz out the reader">
                    BUZZ
                </button>
                <div class="judge-status" id="judgeStatus">
                    <div class="buzz-count" id="buzzCountDisplay" aria-live="polite">0 of ${connectedJudges.length} buzzed</div>
                </div>
            `;

            renderJudgePanels(false);

            // Show header timer
            const headerTimer = document.getElementById('headerTimer');
            headerTimer.style.display = 'flex';

            if (timer) timer.stop();
            timer = new Timer(
                Infinity,
                (elapsed) => {
                    document.getElementById('headerTimer').textContent = formatTime(elapsed);
                }
            );
            timer.start(roundData.start_time);
        }

        function buzz() {
            if (buzzed) return;
            buzzed = true;

            const button = document.getElementById('buzzButton');
            button.disabled = true;
            button.innerHTML = '<div class="buzzed">✕</div>';

            client.buzz(myJudgeId);
        }

        function renderJudgePanels(preserveBuzzed = true) {
            renderJudgePanelCells('judgePanels', connectedJudges, preserveBuzzed);
            updateBuzzCount();
        }

        function updateJudgeCount() {
            const countEl = document.getElementById('judgeCount');
            if (countEl) {
                countEl.textContent = connectedJudges.length;
            }
        }

        function updateBuzzCount() {
            const buzzCountEl = document.getElementById('buzzCountDisplay');
            if (!buzzCountEl) return;

            const buzzedCount = document.querySelectorAll('.judge-cell.buzzed').length;
            const totalCount = connectedJudges.length;

            buzzCountEl.textContent = `${buzzedCount} of ${totalCount} buzzed`;

            if (buzzedCount > 0) {
                buzzCountEl.classList.add('active');
            }
        }

        function updateJudgeStatus(judgeId) {
            const cell = document.querySelector(`.judge-cell[data-judge="${judgeId}"]`);
            if (cell) {
                cell.classList.add('buzzed');
                updateBuzzCount();
            }
        }

        function resetView() {
            if (timer) timer.stop();
            if (countdown) countdown.cancel();
            buzzed = false;
            document.getElementById('main').innerHTML = '<div class="story-title" id="storyTitle" aria-live="polite"></div><div class="waiting">Waiting for round to start...</div>';
            document.getElementById('headerTimer').style.display = 'none';
            document.querySelectorAll('.judge-cell').forEach(cell => {
                cell.classList.remove('buzzed');
            });
        }

        // Name editor modal
        function openNameEditor() {
            const overlay = document.getElementById('nameModalOverlay');
            const input = document.getElementById('nameInput');
            input.value = myJudgeName || '';
            overlay.classList.add('active');
            input.focus();
        }

        document.getElementById('nameSaveBtn').addEventListener('click', () => {
            const name = document.getElementById('nameInput').value.trim().slice(0, 20);
            if (name) {
                myJudgeName = name;
                saveName(name);
                client.setJudgeName(name);
                const el = document.getElementById('judgeNum');
                el.textContent = name;
                el.classList.remove('waiting');
            }
            document.getElementById('nameModalOverlay').classList.remove('active');
        });

        document.getElementById('nameCancelBtn').addEventListener('click', () => {
            document.getElementById('nameModalOverlay').classList.remove('active');
        });

        // Allow Enter to save, Escape to cancel
        document.getElementById('nameInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('nameSaveBtn').click();
            if (e.key === 'Escape') document.getElementById('nameCancelBtn').click();
        });
    </script>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-buttons">
                <button class="modal-btn" id="modalOk">OK</button>
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="modal.js"></script>
</body>
</html>
