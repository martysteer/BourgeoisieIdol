<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controller - SPECULATIVE IDOL</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modal.css">
    <style>
        h2 {
            font-size: var(--text-subheading);
            line-height: 1.4;
        }

        .page-footer {
            padding: 0;
            border-top: none;
        }

        /* Collapsible section pattern */
        .collapsible {
            border-top: 2px solid var(--neon-green);
            padding: 1rem 2rem;
        }

        .collapsible h2 {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
            padding: 0;
        }

        .collapsible .arrow {
            transition: transform 0.3s;
        }

        .collapsible.collapsed .arrow {
            transform: rotate(-90deg);
        }

        .collapsible.collapsed .section-content {
            display: none;
        }

        .collapsible .section-content {
            margin-top: 1rem;
        }

        /* Session management — danger zone override */
        .session-management {
            border-top-color: var(--neon-red);
        }

        .session-management h2 {
            color: var(--neon-red);
            font-size: var(--text-body);
        }

        .session-management .section-content {
            flex-direction: column;
            gap: 0.5rem;
        }

        .session-management:not(.collapsed) .section-content {
            display: flex;
        }

        .danger-btn {
            font-size: var(--text-body);
            padding: 0.75rem;
            background: var(--black);
            color: var(--neon-red);
            border: 2px solid var(--neon-red);
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .danger-btn:hover {
            background: var(--neon-red);
            color: var(--black);
            box-shadow: 0 0 20px var(--neon-red);
        }


        .selected-story-display {
            display: flex;
            border-top: 3px solid var(--neon-yellow);
            border-bottom: 3px solid var(--neon-yellow);
            background: rgba(255, 255, 0, 0.05);
            min-height: 200px;
        }

        .round-controls-column {
            flex: 0 0 33%;
            padding: 1.5rem 2rem;
            border-right: 2px solid var(--neon-yellow);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .story-text-column {
            flex: 1;
            padding: 1.5rem 2rem;
            overflow-y: auto;
            min-height: 50vh;
            max-height: 50vh;
            position: relative;
        }

        .story-text-column .story-text {
            font-size: var(--text-body);
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .story-text-column .text-line {
            display: block;
            opacity: 0;
            transform: translateY(10px);
            animation: lineAppear 0.3s ease-out forwards;
        }

        @keyframes lineAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .story-text-column .empty-text {
            opacity: 0.4;
            font-style: italic;
        }

        .status-text {
            font-family: 'Courier New', monospace;
            font-size: var(--text-body);
            color: var(--neon-green);
        }

        .round-controls-column[data-status="running"] {
            border-color: var(--neon-green);
            background: rgba(0, 255, 0, 0.05);
        }

        .round-controls-column[data-status="paused"] {
            border-color: var(--neon-yellow);
            background: rgba(255, 255, 0, 0.05);
        }

        .round-controls-column[data-status="ended"] {
            border-color: var(--neon-red);
            background: rgba(255, 0, 0, 0.05);
        }

        .status-text[data-status="running"] {
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }

        .status-text[data-status="paused"] {
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        .status-text[data-status="ended"] {
            color: var(--neon-red);
        }

        /* Story management — grid content */
        .story-management .section-content {
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .story-management:not(.collapsed) .section-content {
            display: grid;
        }

        .management-section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        @media (max-width: 900px) {
            .story-management .section-content {
                grid-template-columns: 1fr;
            }

            .selected-story-display {
                flex-direction: column;
            }

            .round-controls-column {
                flex: none;
                border-right: none;
                border-bottom: 2px solid var(--neon-yellow);
            }

            .story-text-column {
                max-height: 30vh;
            }
        }

        /* Ghost-style buttons for controller (inverted from core filled style) */
        button {
            background: var(--black);
            color: var(--neon-green);
        }

        button:hover:not(:disabled) {
            background: var(--neon-green);
            color: var(--black);
        }

        textarea {
            width: 100%;
            min-height: 100px;
            resize: vertical;
        }

        .story-queue {
            list-style: none;
        }

        .story-item {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .story-item:last-child {
            border-bottom: none;
        }

        .story-item:hover {
            color: var(--neon-yellow);
        }

        .story-item.current {
            color: var(--neon-yellow);
        }

        .story-item.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .story-item.disabled:hover {
            color: inherit;
        }

        .story-info {
            flex: 1;
            min-width: 0; /* Allow shrinking */
            overflow: hidden;
        }

        .story-info strong {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .story-status {
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-caption);
            white-space: nowrap;
            padding-left: 0.5rem;
        }

        .story-status.victory {
            color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green);
        }

        .story-status.defeat {
            color: var(--neon-red);
            text-shadow: 0 0 5px var(--neon-red);
        }

        .story-status.running {
            color: var(--neon-green);
            animation: pulse-glow 1.5s ease-in-out infinite;
        }

        .story-status.paused {
            color: var(--neon-yellow);
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; text-shadow: 0 0 5px var(--neon-green); }
            50% { opacity: 0.5; text-shadow: none; }
        }

        /* Empty state styling */
        .empty-state {
            text-align: center;
            padding: 2rem;
            opacity: 0.7;
            line-height: 1.8;
        }

        .empty-state .cta {
            color: var(--neon-yellow);
            font-weight: bold;
            margin-top: 0.5rem;
            display: block;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .btn-advance {
            background: var(--neon-yellow);
            color: var(--black);
            border-color: var(--neon-yellow);
        }

        .btn-advance:hover:not(:disabled) {
            box-shadow: 0 0 20px var(--neon-yellow);
        }

        .text-progress {
            font-family: 'Courier New', monospace;
            font-size: var(--text-caption);
            opacity: 0.7;
        }

        #textProgress {
            display: none;
        }

        .btn-copy-json {
            font-size: var(--text-caption);
            padding: 0.5rem 1rem;
            margin-left: 1rem;
            vertical-align: middle;
        }

        .btn-pause {
            background: var(--black);
            color: var(--neon-yellow);
            border-color: var(--neon-yellow);
        }

        .btn-pause:hover:not(:disabled) {
            background: var(--neon-yellow);
            color: var(--black);
            box-shadow: 0 0 20px var(--neon-yellow);
        }

        .btn-reset {
            background: var(--black);
            color: var(--neon-red);
            border-color: var(--neon-red);
        }

        .btn-reset:hover:not(:disabled) {
            background: var(--neon-red);
            color: var(--black);
            box-shadow: 0 0 20px var(--neon-red);
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
            font-size: var(--text-body);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item.defeat {
            color: var(--neon-red);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
        }

        .management-section h3 {
            font-size: var(--text-subheading);
            margin-bottom: 1rem;
            color: var(--neon-green);
        }

        /* Story edit panel */
        .story-edit-details > *:not(summary) {
            margin-top: 0.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
            font-size: var(--text-body);
        }

        .import-export {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .import-export textarea {
            min-height: 200px;
            font-size: var(--text-caption);
        }

        /* De-emphasize secondary controls */
        .btn-pause, .btn-reset, .btn-qr-toggle {
            font-size: var(--text-caption);
            padding: 0.4rem 0.8rem;
            opacity: 0.6;
        }

        .btn-pause:hover:not(:disabled),
        .btn-reset:hover:not(:disabled) {
            opacity: 1;
        }

        /* Judge/Audience config section */
        .judge-audience-config {
            margin-top: auto;
            padding-top: 1rem;
        }

        .judge-audience-config img {
            display: block;
        }

        .config-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: var(--text-caption);
            margin-bottom: 0.4rem;
            cursor: pointer;
        }

        .config-checkbox input[type="checkbox"] {
            accent-color: var(--neon-yellow);
            width: 1rem;
            height: 1rem;
        }

        /* Countdown on controller: smaller, less prominent */
        #countdown-container .countdown-number {
            font-size: 4rem;
            opacity: 0.7;
        }

        /* Story edit panel actions */
        .edit-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-add-story {
            background: var(--black);
            color: var(--neon-yellow);
            border-color: var(--neon-yellow);
            align-self: flex-start;
        }

        .btn-add-story:hover:not(:disabled) {
            background: var(--neon-yellow);
            color: var(--black);
            box-shadow: 0 0 20px var(--neon-yellow);
        }

        .queue-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        /* Outcome overlay — contained in story text column */
        .outcome {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', cursive;
            font-size: calc(var(--text-display) * 1.5);
            z-index: 100;
            text-align: center;
            line-height: 1.2;
            pointer-events: none;
        }

        .outcome.victory {
            color: var(--neon-green);
            text-shadow: 0 0 20px var(--neon-green);
        }

        .outcome.defeat {
            color: var(--neon-red);
            text-shadow: 0 0 20px var(--neon-red);
        }

        /* Management queue items (different from main queue - clickable for editing) */
        #mgmtStoryQueue .story-item.editing {
            color: var(--neon-yellow);
            border-left: 3px solid var(--neon-yellow);
            padding-left: calc(0.5rem - 3px);
        }
    </style>
</head>
<body class="page-scrollable">
    <header class="page-header">
        <div class="header-left">
            <div class="page-label">CONTROLLING</div>
            <div class="header-info">
                <span class="code" id="sessionCode">----</span> |
                <span id="storyCount">0</span> stories |
                <span id="judgeCount">0</span> judges |
                <span id="audienceCount">0</span> audience
            </div>
        </div>
        <div class="header-timer" id="headerTimer" style="display: none;">0:00.0</div>
        <div class="header-context waiting" id="headerStoryTitle">No story selected</div>
    </header>

    <div id="countdown-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1000;"></div>

    <main class="page-content">
    <!-- PRIMARY: Controls + live story text -->
    <div class="selected-story-display">
        <div class="round-controls-column">
            <div id="currentStatus" class="status-text" role="status" aria-live="polite">Status: Waiting</div>
            <div class="controls">
                <button onclick="startRound()" id="startBtn">Start Round</button>
                <button onclick="advanceText()" id="advanceBtn" class="btn-advance" disabled>Advance Text</button>
                <button onclick="togglePause()" id="pauseBtn" class="btn-pause" disabled>Pause</button>
                <button onclick="closeRound()" id="closeBtn" class="btn-reset">Close Round</button>
            </div>
            <div id="textProgress" class="text-progress" role="status" aria-live="polite"></div>
            <details open class="judge-audience-config">
                <summary style="cursor:pointer;font-size:var(--text-caption);margin-bottom:0.5rem;">Judge/Audience Config</summary>
                <label class="config-checkbox">
                    <input type="checkbox" id="toggleQRCheckbox" onchange="toggleAudienceQR(this.checked)"> Display QR to audience
                </label>
                <label class="config-checkbox">
                    <input type="checkbox" id="toggleTimerCheckbox" checked onchange="toggleTimerVisibility(this.checked)"> Display timer to audience/judges
                </label>
                <div id="judgeQRContainer"></div>
            </details>
        </div>
        <div class="story-text-column">
            <div class="story-text" id="liveStoryText">
                <span class="empty-text">Story text appears here during round...</span>
            </div>
            <div class="outcome" id="outcome" role="alert" aria-live="assertive"></div>
        </div>
    </div>

    <!-- Story management (expanded by default) -->
    <div class="collapsible story-management" id="storyManagement">
        <h2 onclick="toggleSection('storyManagement')">
            <span class="arrow">▼</span>
            Story Queue
        </h2>
        <div class="section-content">
            <div class="management-section">
                <ul class="story-queue" id="mgmtStoryQueue"></ul>
            </div>

            <div class="management-section">
                <button onclick="addNewStory()" class="btn-add-story" style="font-size:var(--text-caption);padding:0.4rem 0.8rem;">+ Add Story</button>
                <details class="story-edit-details" id="storyEditPanel">
                    <summary style="cursor:pointer;font-size:var(--text-caption);opacity:0.7;" id="storyFormTitle">Add / Edit Story</summary>
                    <div class="form-group">
                        <label>Title:</label>
                        <input type="text" id="storyTitle" placeholder="Story title">
                    </div>
                    <div class="form-group">
                        <label>Text:</label>
                        <textarea id="storyText" placeholder="Story text..."></textarea>
                    </div>
                    <div class="edit-actions">
                        <button onclick="saveStory()" id="saveStoryBtn" disabled>Update</button>
                        <button onclick="removeEditingStory()" id="removeStoryBtn" class="btn-reset">Remove</button>
                    </div>
                </details>
                <details style="margin-top: 0.5rem;">
                    <summary style="cursor:pointer;font-size:var(--text-caption);opacity:0.7;">Import / Export</summary>
                    <div style="margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
                        <textarea id="importExportJson" placeholder="Paste JSON here to import..." style="min-height:150px;font-size:var(--text-caption);"></textarea>
                        <div class="queue-actions">
                            <button onclick="exportSession()" style="font-size:var(--text-caption);padding:0.4rem 0.8rem;">Export JSON</button>
                            <button onclick="importSession()" id="importBtn" style="font-size:var(--text-caption);padding:0.4rem 0.8rem;" disabled>Import JSON</button>
                        </div>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <!-- TERTIARY: History (collapsed by default) -->
    <div class="collapsible collapsed" id="historySection">
        <h2 onclick="toggleSection('historySection')">
            <span class="arrow">▼</span>
            History
        </h2>
        <div class="section-content">
            <button onclick="copyHistory()" class="btn-copy-json">Copy JSON</button>
            <ul class="history-list" id="historyList"></ul>
        </div>
    </div>

    </main>

    <footer class="page-footer">
        <!-- Session management (collapsed, danger zone) -->
        <div class="collapsible session-management collapsed" id="sessionManagementSection">
            <h2 onclick="toggleSection('sessionManagementSection')">
                <span class="arrow">▼</span>
                Session Management (Danger Zone)
            </h2>
            <div class="section-content">
                <button class="danger-btn" onclick="ejectJudges()">Eject All Judges</button>
                <button class="danger-btn" onclick="shutdownAudience()">Shutdown All Audience</button>
                <button class="danger-btn" onclick="deleteSession()">Delete Session</button>
            </div>
        </div>
    </footer>

    <script src="lib/qrcode-generator.js"></script>
    <script src="sounds.js"></script>
    <script src="app.js"></script>
    <script>
        const params = getUrlParams();
        const client = new SpecIdolClient();
        let sessionState = null;
        let editingStoryIndex = null;
        let currentLineProgress = { position: 0, total: 0 };
        let audienceQRVisible = false;
        let timer = null;
        let countdown = null;
        let formDirty = false;

        client.connect();

        client.onConnect = () => {
            if (params.code) {
                client.joinSession(params.code, 'controller');
            } else {
                client.createSession();
            }
        };

        client.on('session_created', (data) => {
            document.getElementById('sessionCode').textContent = data.code;
            // Update URL to include code
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('code', data.code);
            window.history.replaceState({}, '', newUrl);
            // Join as controller
            client.joinSession(data.code, 'controller');
        });

        client.on('session_state', (data) => {
            sessionState = data;
            updateUI();
            updateSessionCounts(data);

            // Initialize status on page load
            const hasStory = sessionState.current_round.story_index !== null;
            if (!hasStory && sessionState.current_round.status === 'waiting') {
                updateStatus('waiting'); // Will show "select a story"
            }

            // Generate judge QR code
            const sessionCode = data.code;
            const judgeURL = `${window.location.origin}/judge.html?code=${sessionCode}`;
            const qrEl = createQRElement(judgeURL, sessionCode, 200);
            const qrContainer = document.getElementById('judgeQRContainer');
            qrContainer.innerHTML = '';
            qrContainer.appendChild(qrEl);

            // Click QR to open judge page in new tab
            qrContainer.style.cursor = 'pointer';
            qrContainer.title = 'Click to open judge page';
            qrContainer.onclick = () => window.open(judgeURL, '_blank');

            // Set audience QR toggle state
            audienceQRVisible = data.audience_qr_visible !== false;
            document.getElementById('toggleQRCheckbox').checked = audienceQRVisible;

            // Set timer visibility toggle state
            const timerVisible = data.timer_visible !== false;
            document.getElementById('toggleTimerCheckbox').checked = timerVisible;
        });

        client.on('judge_joined', (data) => {
            if (sessionState) {
                updateSessionCounts({connected_judges: data.connected_judges});
            }
        });

        client.on('judge_left', (data) => {
            if (sessionState) {
                updateSessionCounts({connected_judges: data.connected_judges});
            }
        });

        client.on('audience_joined', (data) => {
            if (sessionState) {
                updateSessionCounts({audience_count: data.audience_count});
            }
        });

        client.on('audience_left', (data) => {
            if (sessionState) {
                updateSessionCounts({audience_count: data.audience_count});
            }
        });

        client.on('countdown_start', (data) => {
            // Track title for history
            if (sessionState) {
                sessionState.current_round.title = data.story_title;
                sessionState.current_round.status = 'countdown';
                renderMgmtQueue();
            }

            // Reset timer and outcome
            hideOutcome();
            if (timer) timer.stop();
            const timerEl = document.getElementById('headerTimer');
            timerEl.style.display = 'flex';
            timerEl.textContent = '0:00.0';

            // Clear dimmed preview and show first paragraph
            if (data.first_line) {
                document.getElementById('liveStoryText').innerHTML = '';
                appendStoryLine(data.first_line);
            }

            // Show countdown
            if (countdown) countdown.cancel();
            countdown = new Countdown('countdown-container', () => {
                // Countdown complete — tell server to start the round
                const storyIdx = data.story_index !== undefined
                    ? data.story_index
                    : (sessionState ? sessionState.current_round.story_index : 0);
                client.startRound(storyIdx);
            });
            countdown.start();
        });

        client.on('buzzed', (data) => {
            // Play buzz sound
            if (client.judgeSounds) {
                const soundIndex = client.judgeSounds[data.judge_id];
                if (soundIndex !== undefined) {
                    playBuzz(soundIndex, data.buzz_count || 1);
                }
            }

            // Check for final combo (all judges buzzed)
            if (sessionState) {
                const totalJudges = Object.keys(client.judgeSounds || {}).length;
                const buzzedCount = data.total_buzzed || 0;
                if (buzzedCount >= totalJudges && totalJudges > 0) {
                    setTimeout(() => {
                        playFinalCombo(Object.values(client.judgeSounds || {}));
                    }, 900);
                }
            }
        });

        client.on('story_added', (data) => {
            // Controller already updates local state in addStory().
            // This handler covers stories added by import or future multi-controller.
            if (sessionState && data.index >= sessionState.stories.length) {
                sessionState.stories.push({title: data.title, text: ''});
                renderMgmtQueue();
            }
            updateSessionCounts({stories: sessionState.stories});
        });

        client.on('story_removed', (data) => {
            if (sessionState && data.index < sessionState.stories.length) {
                sessionState.stories.splice(data.index, 1);
                renderMgmtQueue();
                // If we were editing the removed story, close edit panel
                if (editingStoryIndex === data.index) {
                    editingStoryIndex = null;
                    document.getElementById('storyEditPanel').open = false;
                } else if (editingStoryIndex !== null && editingStoryIndex > data.index) {
                    editingStoryIndex--;
                }
            }
            updateSessionCounts({stories: sessionState.stories});
        });

        client.on('stories_update', (data) => {
            if (sessionState) {
                sessionState.stories = data.stories;
                renderMgmtQueue();
                updateSessionCounts({stories: data.stories});
            }
        });

        client.on('round_started', (data) => {
            if (data.server_time) updateClockOffset(data.server_time);
            updateStatus('running');

            // Start header timer
            const timerEl = document.getElementById('headerTimer');
            timerEl.style.display = 'flex';
            if (timer) timer.stop();
            timer = new Timer(Infinity, (elapsed) => {
                timerEl.textContent = formatTime(elapsed);
            });
            timer.start(data.start_time || (Date.now() / 1000));

            if (sessionState) {
                sessionState.current_round.status = 'running';
                sessionState.current_round.text_line_count = data.text_line_count || 0;
                renderMgmtQueue();
            }
            updateSelectedStoryDisplay();
            updateTextProgress(0, data.text_line_count || 0);
        });

        client.on('text_advanced', (data) => {
            updateTextProgress(data.position + 1, data.total);
            appendStoryLine(data.line);
        });

        client.on('paused', (data) => {
            updateStatus('paused', currentLineProgress.position, currentLineProgress.total);
            if (timer) timer.pause();
            if (sessionState) {
                sessionState.current_round.status = 'paused';
                renderMgmtQueue();
            }
        });

        client.on('resumed', (data) => {
            updateStatus('running', currentLineProgress.position, currentLineProgress.total);
            if (timer) timer.resume(data.timestamp - data.elapsed);
            if (sessionState) {
                sessionState.current_round.status = 'running';
                renderMgmtQueue();
            }
        });

        client.on('round_ended', (data) => {
            updateStatus('ended');
            if (timer) timer.stop();
            showOutcome(data.outcome);
            if (data.outcome === 'victory') {
                playVictoryFanfare();
            }
            if (sessionState) {
                sessionState.current_round.status = 'ended';
                sessionState.history.push({
                    title: sessionState.current_round.title,
                    ...data
                });
                renderHistory();
                renderMgmtQueue();
            }
        });

        client.on('round_reset', () => {
            updateStatus('waiting');
            hideOutcome();
            clearStoryText();
            currentLineProgress = { position: 0, total: 0 };
            if (timer) timer.stop();
            if (countdown) countdown.cancel();
            document.getElementById('headerTimer').style.display = 'none';
            if (sessionState) {
                sessionState.current_round.status = 'waiting';
                sessionState.current_round.story_index = null;
                updateSelectedStoryDisplay();
                renderMgmtQueue();
            }
        });

        client.on('session_imported', async (data) => {
            await customAlert(`Imported ${data.story_count} stories`);
            // Trigger refresh by requesting session state
            if (params.code) {
                client.joinSession(params.code, 'controller');
            }
        });

        client.on('error', async (data) => {
            if (data.message === 'Invalid session code') {
                await customAlert('Session no longer exists. Returning to home.');
                window.location.href = 'index.html';
            }
        });

        function updateUI() {
            if (!sessionState) return;

            document.getElementById('sessionCode').textContent = sessionState.code || '----';
            renderMgmtQueue();
            renderHistory();
            updateStatus(sessionState.current_round.status);
            updateSelectedStoryDisplay();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (!sessionState || sessionState.history.length === 0) {
                list.innerHTML = '<li style="opacity: 0.7; text-align: center; padding: 1rem;">No rounds completed yet. Start a round to build history.</li>';
                return;
            }

            list.innerHTML = sessionState.history.map(entry => {
                const buzzCount = entry.buzzes ? entry.buzzes.length : 0;
                const buzzHistory = entry.buzz_history || [];
                const buzzDetails = buzzHistory.map(b =>
                    `${escapeHtml(b.judge_name)} @ ${b.time}s`
                ).join(', ');
                const buzzInfo = buzzDetails ? ` [${buzzDetails}]` : '';
                return `
                    <li class="history-item ${entry.outcome}">
                        ${escapeHtml(entry.title)} — ${entry.outcome.toUpperCase()}
                        <span style="font-size: var(--text-caption); opacity: 0.7;">(${entry.duration}s, ${buzzCount} buzz${buzzCount !== 1 ? 'es' : ''}${buzzInfo})</span>
                    </li>
                `;
            }).join('');
        }

        function updateStatus(status, position = null, total = null) {
            const statusEl = document.getElementById('currentStatus');

            let statusText;
            if ((status === 'running' || status === 'paused') && position !== null && total !== null && position > 0) {
                const statusWord = status === 'paused' ? 'paused' : 'running';
                statusText = `Status: ${statusWord}, part ${position}/${total}`;
            } else if (status === 'waiting') {
                const hasStory = sessionState && sessionState.current_round.story_index !== null;
                statusText = hasStory ? 'Status: waiting' : 'Status: select a story';
            } else {
                // For other states, check if story is selected
                const hasStory = sessionState && sessionState.current_round.story_index !== null;
                statusText = hasStory ? `Status: ${status}` : 'Status: select a story';
            }

            statusEl.textContent = statusText;
            statusEl.dataset.status = status;

            const controlsCol = document.querySelector('.round-controls-column');
            if (controlsCol) controlsCol.dataset.status = status;

            const startBtn = document.getElementById('startBtn');
            const advanceBtn = document.getElementById('advanceBtn');
            const pauseBtn = document.getElementById('pauseBtn');

            startBtn.disabled = (status === 'running' || status === 'paused');
            advanceBtn.disabled = (status !== 'running');
            pauseBtn.disabled = (status !== 'running' && status !== 'paused');
            pauseBtn.textContent = (status === 'paused') ? 'Resume' : 'Pause';
        }

        function updateTextProgress(position, total) {
            currentLineProgress = { position, total };
            if (sessionState && sessionState.current_round.status === 'running') {
                updateStatus('running', position, total);
            }
        }

        function appendStoryLine(line) {
            const textEl = document.getElementById('liveStoryText');
            // Clear placeholder on first line
            const placeholder = textEl.querySelector('.empty-text');
            if (placeholder) placeholder.remove();

            const lineSpan = document.createElement('span');
            lineSpan.className = 'text-line';
            lineSpan.textContent = line;

            if (textEl.children.length > 0) {
                const br = document.createElement('br');
                textEl.appendChild(br);
            }
            textEl.appendChild(lineSpan);

            setTimeout(() => {
                lineSpan.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function showOutcome(outcome) {
            const el = document.getElementById('outcome');
            el.textContent = outcome === 'victory' ? 'SURVIVOR!' : 'BUZZED OUT';
            el.className = `outcome ${outcome}`;
            el.style.display = 'block';
        }

        function hideOutcome() {
            document.getElementById('outcome').style.display = 'none';
        }

        function clearStoryText() {
            const textEl = document.getElementById('liveStoryText');
            const index = sessionState ? sessionState.current_round.story_index : null;

            if (index !== null && sessionState.stories[index]) {
                // Show dimmed preview of full story text
                textEl.innerHTML = '';
                const preview = document.createElement('div');
                preview.style.opacity = '0.3';
                preview.style.whiteSpace = 'pre-wrap';
                preview.style.lineHeight = '1.7';
                preview.textContent = sessionState.stories[index].text;
                textEl.appendChild(preview);
            } else {
                textEl.innerHTML = '<span class="empty-text">Story text appears here during round...</span>';
            }
        }

        // --- Story management (2-column: queue left, edit form right) ---

        function renderMgmtQueue() {
            const queue = document.getElementById('mgmtStoryQueue');
            if (!sessionState || !sessionState.stories || sessionState.stories.length === 0) {
                queue.innerHTML = `
                    <li class="empty-state">
                        No stories yet.
                        <span class="cta">Click "+ Add Story" below ↓</span>
                    </li>
                `;
                return;
            }

            const status = sessionState.current_round.status;
            const roundActive = status === 'running' || status === 'paused';

            queue.innerHTML = sessionState.stories.map((story, i) => {
                const isCurrent = i === sessionState.current_round.story_index;
                const editingClass = i === editingStoryIndex ? 'editing' : '';
                const disabledClass = roundActive ? 'disabled' : '';

                // Determine status marker
                let statusHtml = '';
                const roundStatus = sessionState.current_round.status;
                if (isCurrent && (roundStatus === 'running' || roundStatus === 'countdown')) {
                    statusHtml = '<span class="story-status running">RUNNING</span>';
                } else if (isCurrent && roundStatus === 'paused') {
                    statusHtml = '<span class="story-status paused">PAUSED</span>';
                } else if (sessionState.history) {
                    const entry = sessionState.history.find(h => h.title === story.title);
                    if (entry && entry.outcome === 'victory') {
                        statusHtml = '<span class="story-status victory">SURVIVOR</span>';
                    } else if (entry && entry.outcome === 'defeat') {
                        statusHtml = '<span class="story-status defeat">BUZZED OUT</span>';
                    }
                }

                return `
                    <li class="story-item ${isCurrent ? 'current' : ''} ${editingClass} ${disabledClass}" onclick="selectStory(${i})">
                        <div class="story-info">
                            <strong>${i + 1}. ${escapeHtml(story.title)}</strong>
                        </div>
                        ${statusHtml}
                    </li>
                `;
            }).join('');
        }

        function editStory(index) {
            if (!sessionState || !sessionState.stories[index]) return;

            const story = sessionState.stories[index];
            document.getElementById('storyTitle').value = story.title;
            document.getElementById('storyText').value = story.text;
            editingStoryIndex = index;
            formDirty = false;

            document.getElementById('storyFormTitle').textContent = 'Edit: ' + story.title;
            document.getElementById('saveStoryBtn').textContent = 'Update';
            document.getElementById('saveStoryBtn').disabled = true;
            document.getElementById('removeStoryBtn').style.display = '';

            renderMgmtQueue();
        }

        function addNewStory() {
            editingStoryIndex = null;
            formDirty = false;
            document.getElementById('storyTitle').value = '';
            document.getElementById('storyText').value = '';

            const panel = document.getElementById('storyEditPanel');
            panel.open = true;
            document.getElementById('storyFormTitle').textContent = 'Add Story';
            document.getElementById('saveStoryBtn').textContent = 'Create';
            document.getElementById('saveStoryBtn').disabled = false;
            document.getElementById('removeStoryBtn').style.display = 'none';

            renderMgmtQueue();
        }

        // Enable import button when textarea has content
        document.getElementById('importExportJson').addEventListener('input', updateImportBtnState);

        // Enable save button on edits
        document.getElementById('storyTitle').addEventListener('input', () => {
            formDirty = true;
            document.getElementById('saveStoryBtn').disabled = false;
        });
        document.getElementById('storyText').addEventListener('input', () => {
            formDirty = true;
            document.getElementById('saveStoryBtn').disabled = false;
        });

        async function saveStory() {
            const title = document.getElementById('storyTitle').value.trim();
            const text = document.getElementById('storyText').value.trim();

            if (!title || !text) {
                await customAlert('Enter both title and text');
                return;
            }

            if (title.length > 200) {
                await customAlert('Title too long (max 200 characters)');
                return;
            }
            if (text.length > 10000) {
                await customAlert('Text too long (max 10,000 characters)');
                return;
            }

            if (editingStoryIndex !== null) {
                // Update existing story
                client.send('update_story', {
                    story_index: editingStoryIndex,
                    title: title,
                    text: text
                });
                // Optimistic local update
                sessionState.stories[editingStoryIndex] = {title, text};
                renderMgmtQueue();
            } else {
                // Add new story
                const wasEmpty = !sessionState || sessionState.stories.length === 0;
                client.addStory(title, text);
                if (sessionState) {
                    sessionState.stories.push({title, text});
                    renderMgmtQueue();
                    if (wasEmpty) {
                        document.getElementById('storyManagement').classList.add('collapsed');
                    }
                }
            }

            document.getElementById('saveStoryBtn').disabled = true;
            formDirty = false;
        }

        async function removeEditingStory() {
            if (editingStoryIndex === null) return;
            if (await customConfirm('Remove this story?')) {
                client.removeStory(editingStoryIndex);
                document.getElementById('storyEditPanel').open = false;
                editingStoryIndex = null;
            }
        }

        async function selectStory(index) {
            if (!sessionState) return;

            // Block story selection during active round
            const status = sessionState.current_round.status;
            if (status === 'running' || status === 'paused') {
                await customAlert('Cannot change story during active round. Close round or wait for it to end.');
                return;
            }

            sessionState.current_round.story_index = index;
            sessionState.current_round.title = sessionState.stories[index].title;
            updateSelectedStoryDisplay();
            clearStoryText();
            editStory(index);
        }

        function updateSelectedStoryDisplay() {
            const headerEl = document.getElementById('headerStoryTitle');
            if (!sessionState) return;

            const index = sessionState.current_round.story_index;
            if (index !== null && sessionState.stories[index]) {
                const title = sessionState.stories[index].title;
                headerEl.textContent = title;
                headerEl.classList.remove('waiting');

                // Update status when story selected
                const currentStatus = sessionState.current_round.status;
                if (currentStatus === 'waiting' || currentStatus === 'ended') {
                    updateStatus('waiting');
                }
            } else {
                headerEl.textContent = 'No story selected';
                headerEl.classList.add('waiting');

                // Update status when no story selected
                updateStatus('waiting'); // Will become "select a story" in updateStatus
            }
        }

        function toggleSection(id) {
            document.getElementById(id).classList.toggle('collapsed');
        }


        async function startRound() {
            const btn = document.getElementById('startBtn');
            if (btn.disabled) return;

            if (!sessionState || sessionState.current_round.story_index === null) {
                await customAlert('Select a story first');
                return;
            }

            btn.disabled = true;
            client.send('countdown_start', { story_index: sessionState.current_round.story_index });
            // Will be re-enabled by round_started event via updateStatus()
        }

        async function closeRound() {
            if (await customConfirm('Close this round early?')) {
                client.resetRound();
            }
        }

        function toggleAudienceQR(visible) {
            audienceQRVisible = visible;
            client.send('toggle_audience_qr', { visible: audienceQRVisible });
        }

        function toggleTimerVisibility(visible) {
            client.send('toggle_timer_visibility', { visible: visible });
        }

        function advanceText() {
            const btn = document.getElementById('advanceBtn');
            if (btn.disabled) return;

            if (!sessionState || sessionState.current_round.status !== 'running') {
                return;
            }

            // Prevent double-click
            btn.disabled = true;
            client.advanceText();

            // Re-enable after short delay
            setTimeout(() => {
                if (sessionState && sessionState.current_round.status === 'running') {
                    btn.disabled = false;
                }
            }, 300);
        }

        // Keyboard shortcut: spacebar or right arrow to advance text
        document.addEventListener('keydown', (e) => {
            // Don't capture if typing in an input/textarea
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            // Don't capture if modal is open
            const modalOverlay = document.getElementById('modalOverlay');
            if (modalOverlay && modalOverlay.classList.contains('active')) return;

            if (e.code === 'Space' || e.code === 'ArrowRight') {
                e.preventDefault();
                advanceText();
            }
        });

        function togglePause() {
            if (!sessionState) return;
            const status = sessionState.current_round.status;
            if (status === 'running') {
                client.pause();
            } else if (status === 'paused') {
                client.resume();
            }
        }

        function exportSession() {
            if (!sessionState) return;

            const exportData = {
                stories: sessionState.stories,
                config: sessionState.config
            };

            const json = JSON.stringify(exportData, null, 2);
            const textarea = document.getElementById('importExportJson');
            textarea.value = json;
            updateImportBtnState();

            // Silently copy to clipboard if possible
            try { navigator.clipboard.writeText(json); } catch (e) {}
        }

        async function copyHistory() {
            if (!sessionState || sessionState.history.length === 0) {
                await customAlert('No history to copy yet');
                return;
            }

            const historyJson = JSON.stringify(sessionState.history, null, 2);
            if (await copyToClipboard(historyJson)) {
                await customAlert('History copied to clipboard!');
            } else {
                await customAlert('Copy failed — history logged to console');
                console.log(historyJson);
            }
        }

        async function copyToClipboard(text) {
            // Try modern API first
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (e) {}
            // Fallback: temporary textarea + execCommand
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) {
                return false;
            }
        }

        async function importSession() {
            const textarea = document.getElementById('importExportJson');
            const json = textarea.value.trim();
            if (!json) return;

            try {
                const data = JSON.parse(json);
                client.importSession(data.stories || [], data.config || {});
                textarea.value = '';
                updateImportBtnState();
            } catch (e) {
                await customAlert('Invalid JSON: ' + e.message);
            }
        }

        function updateImportBtnState() {
            const textarea = document.getElementById('importExportJson');
            const importBtn = document.getElementById('importBtn');
            if (importBtn) {
                importBtn.disabled = !textarea.value.trim();
            }
        }

        function updateSessionCounts(data) {
            if (data.stories !== undefined) {
                document.getElementById('storyCount').textContent = data.stories.length;
            }
            if (data.connected_judges !== undefined) {
                document.getElementById('judgeCount').textContent = data.connected_judges.length;
            }
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
        }

        async function ejectJudges() {
            if (await customConfirm('Eject all judges? They will be disconnected with a message.')) {
                client.send('eject_judges');
            }
        }

        async function shutdownAudience() {
            if (await customConfirm('Shutdown all audience screens? They will be disconnected.')) {
                client.send('shutdown_audience');
            }
        }

        async function deleteSession() {
            if (await customConfirm('DELETE SESSION? This will eject all judges, shutdown all audience screens, and delete the session. This cannot be undone.')) {
                client.send('delete_session');
                // Redirect back to home after deletion
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }
        }
    </script>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-buttons">
                <button class="modal-btn" id="modalOk">OK</button>
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="modal.js"></script>
</body>
</html>
