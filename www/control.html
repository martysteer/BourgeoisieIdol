<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Controller - BOURGEOISIE IDOL</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modal.css">
    <script src="openseadragon.min.js"></script>
    <style>
        h2 {
            font-size: var(--text-subheading);
            line-height: 1.4;
        }

        .page-footer {
            padding: 0;
            border-top: none;
        }

        /* Collapsible section pattern */
        .collapsible {
            border-top: 2px solid var(--neon-green);
            padding: 1rem 2rem;
        }

        .collapsible h2 {
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0;
            padding: 0;
        }

        .collapsible .arrow {
            transition: transform 0.3s;
        }

        .collapsible.collapsed .arrow {
            transform: rotate(-90deg);
        }

        .collapsible.collapsed .section-content {
            display: none;
        }

        .collapsible .section-content {
            margin-top: 1rem;
        }

        /* Session management — danger zone override */
        .session-management {
            border-top-color: var(--neon-red);
        }

        .session-management h2 {
            color: var(--neon-red);
            font-size: var(--text-body);
        }

        .session-management .section-content {
            flex-direction: column;
            gap: 0.5rem;
        }

        .session-management:not(.collapsed) .section-content {
            display: flex;
        }

        .danger-btn {
            font-size: var(--text-body);
            padding: 0.75rem;
            background: var(--black);
            color: var(--neon-red);
            border: 2px solid var(--neon-red);
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .danger-btn:hover {
            background: var(--neon-red);
            color: var(--black);
            box-shadow: 0 0 20px var(--neon-red);
        }


        .selected-story-display {
            display: flex;
            border-top: 3px solid var(--neon-yellow);
            border-bottom: 3px solid var(--neon-yellow);
            background: rgba(255, 255, 0, 0.05);
            min-height: 200px;
        }

        .round-controls-column {
            flex: 0 0 33%;
            padding: 1.5rem 2rem;
            border-right: 2px solid var(--neon-yellow);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .story-text-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem 2rem;
            overflow-y: auto;
            min-height: 50vh;
            max-height: 50vh;
            position: relative;
        }

        .story-text-column .story-text {
            font-size: var(--text-body);
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .story-text-column .text-line {
            display: block;
            opacity: 0;
            transform: translateY(10px);
            animation: lineAppear 0.3s ease-out forwards;
        }

        @keyframes lineAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .story-text-column .empty-text {
            opacity: 0.4;
            font-style: italic;
        }

        #osdViewerContainer {
            flex: 1;
        }

        .overlay-paragraph {
            background: rgba(0, 0, 0, 0.6);
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.95);
        }

        .status-text {
            font-family: 'Courier New', monospace;
            font-size: var(--text-body);
            color: var(--neon-green);
        }

        .round-controls-column[data-status="running"] {
            border-color: var(--neon-green);
            background: rgba(0, 255, 0, 0.05);
        }

        .round-controls-column[data-status="paused"] {
            border-color: var(--neon-yellow);
            background: rgba(255, 255, 0, 0.05);
        }

        .round-controls-column[data-status="ended"] {
            border-color: var(--neon-red);
            background: rgba(255, 0, 0, 0.05);
        }

        .status-text[data-status="running"] {
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }

        .status-text[data-status="paused"] {
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
        }

        .status-text[data-status="ended"] {
            color: var(--neon-red);
        }

        /* Story management — grid content */
        .story-management .section-content {
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .story-management:not(.collapsed) .section-content {
            display: grid;
        }

        .management-section {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        @media (max-width: 900px) {
            .story-management .section-content {
                grid-template-columns: 1fr;
            }

            .selected-story-display {
                flex-direction: column;
            }

            .round-controls-column {
                flex: none;
                border-right: none;
                border-bottom: 2px solid var(--neon-yellow);
            }

            .story-text-column {
                max-height: 30vh;
            }
        }

        /* Ghost-style buttons for controller (inverted from core filled style) */
        button {
            background: var(--black);
            color: var(--neon-green);
        }

        button:hover:not(:disabled) {
            background: var(--neon-green);
            color: var(--black);
        }

        textarea {
            width: 100%;
            min-height: 100px;
            resize: vertical;
        }

        .story-queue {
            list-style: none;
        }

        .story-item {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .story-item:last-child {
            border-bottom: none;
        }

        .story-item:hover {
            color: var(--neon-yellow);
        }

        .story-item.current {
            color: var(--neon-yellow);
        }

        .story-item.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .story-item.disabled:hover {
            color: inherit;
        }

        .story-info {
            flex: 1;
            min-width: 0; /* Allow shrinking */
            overflow: hidden;
        }

        .story-info strong {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .story-status {
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-caption);
            white-space: nowrap;
            padding-left: 0.5rem;
        }

        .story-status.victory {
            color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green);
        }

        .story-status.defeat {
            color: var(--neon-red);
            text-shadow: 0 0 5px var(--neon-red);
        }

        .story-status.running {
            color: var(--neon-green);
            animation: pulse-glow 1.5s ease-in-out infinite;
        }

        .story-status.paused {
            color: var(--neon-yellow);
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; text-shadow: 0 0 5px var(--neon-green); }
            50% { opacity: 0.5; text-shadow: none; }
        }

        /* Empty state styling */
        .empty-state {
            text-align: center;
            padding: 2rem;
            opacity: 0.7;
            line-height: 1.8;
        }

        .empty-state .cta {
            color: var(--neon-yellow);
            font-weight: bold;
            margin-top: 0.5rem;
            display: block;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .btn-advance {
            background: var(--neon-yellow);
            color: var(--black);
            border-color: var(--neon-yellow);
        }

        .btn-advance:hover:not(:disabled) {
            box-shadow: 0 0 20px var(--neon-yellow);
        }

        .text-progress {
            font-family: 'Courier New', monospace;
            font-size: var(--text-caption);
            opacity: 0.7;
        }

        #textProgress {
            display: none;
        }

        .btn-copy-json {
            font-size: var(--text-caption);
            padding: 0.5rem 1rem;
            margin-left: 1rem;
            vertical-align: middle;
        }

        .btn-pause {
            background: var(--black);
            color: var(--neon-yellow);
            border-color: var(--neon-yellow);
        }

        .btn-pause:hover:not(:disabled) {
            background: var(--neon-yellow);
            color: var(--black);
            box-shadow: 0 0 20px var(--neon-yellow);
        }

        .btn-reset {
            background: var(--black);
            color: var(--neon-red);
            border-color: var(--neon-red);
        }

        .btn-reset:hover:not(:disabled) {
            background: var(--neon-red);
            color: var(--black);
            box-shadow: 0 0 20px var(--neon-red);
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
            font-size: var(--text-body);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-item.defeat {
            color: var(--neon-red);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
        }

        .management-section h3 {
            font-size: var(--text-subheading);
            margin-bottom: 1rem;
            color: var(--neon-green);
        }

        /* Story edit panel */
        .story-edit-details > *:not(summary) {
            margin-top: 0.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
            font-size: var(--text-body);
        }

        .import-export {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .import-export textarea {
            min-height: 200px;
            font-size: var(--text-caption);
        }

        /* De-emphasize secondary controls */
        .btn-pause, .btn-reset, .btn-qr-toggle {
            font-size: var(--text-caption);
            padding: 0.4rem 0.8rem;
            opacity: 0.6;
        }

        .btn-pause:hover:not(:disabled),
        .btn-reset:hover:not(:disabled) {
            opacity: 1;
        }

        /* Judge/Audience config section */
        .judge-audience-config {
            margin-top: auto;
            padding-top: 1rem;
        }

        .judge-audience-config img {
            display: block;
        }

        .config-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: var(--text-caption);
            margin-bottom: 0.4rem;
            cursor: pointer;
        }

        .config-checkbox input[type="checkbox"] {
            accent-color: var(--neon-yellow);
            width: 1rem;
            height: 1rem;
        }

        /* Countdown on controller: smaller, less prominent */
        #countdown-container .countdown-number {
            font-size: 4rem;
            opacity: 0.7;
        }

        /* Story edit panel actions */
        .edit-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-add-story {
            background: var(--black);
            color: var(--neon-yellow);
            border-color: var(--neon-yellow);
            align-self: flex-start;
        }

        .btn-add-story:hover:not(:disabled) {
            background: var(--neon-yellow);
            color: var(--black);
            box-shadow: 0 0 20px var(--neon-yellow);
        }

        .queue-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        /* Outcome overlay — contained in story text column */
        .outcome {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', cursive;
            font-size: calc(var(--text-display) * 1.5);
            z-index: 100;
            text-align: center;
            line-height: 1.2;
            pointer-events: none;
        }

        .outcome.victory {
            color: var(--neon-green);
            text-shadow: 0 0 20px var(--neon-green);
        }

        .outcome.defeat {
            color: var(--neon-red);
            text-shadow: 0 0 20px var(--neon-red);
        }

        /* Management queue items (different from main queue - clickable for editing) */
        #mgmtItemQueue .story-item.editing {
            color: var(--neon-yellow);
            border-left: 3px solid var(--neon-yellow);
            padding-left: calc(0.5rem - 3px);
        }
    </style>
</head>
<body class="page-scrollable">
    <header class="page-header">
        <div class="header-left">
            <div class="page-label">CONTROLLING</div>
            <div class="header-info">
                <span class="code" id="sessionCode">----</span> |
                <span id="itemCount">0</span> items |
                <span id="judgeCount">0</span> judges |
                <span id="audienceCount">0</span> audience
            </div>
        </div>
        <div class="header-timer" id="headerTimer" style="display: none;">0:00.0</div>
        <div class="header-context waiting" id="headerItemTitle">No item selected</div>
    </header>

    <div id="countdown-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1000;"></div>

    <main class="page-content">
    <!-- PRIMARY: Controls + live story text -->
    <div class="selected-story-display">
        <div class="round-controls-column">
            <div id="currentStatus" class="status-text" role="status" aria-live="polite">Status: Waiting</div>
            <div class="controls">
                <button onclick="startRound()" id="startBtn">Start Round</button>
                <button onclick="advanceText()" id="advanceBtn" class="btn-advance" disabled>Reveal Paragraph</button>
                <button onclick="advanceCanvas('next')" id="nextCanvasBtn" style="display:none;" disabled>Next Canvas &#9654;</button>
                <button onclick="advanceCanvas('prev')" id="prevCanvasBtn" style="display:none;" disabled>&#9664; Prev Canvas</button>
                <span id="canvasProgress" style="display:none; font-size: var(--text-caption); white-space: nowrap;"></span>
                <button onclick="togglePause()" id="pauseBtn" class="btn-pause" disabled>Pause</button>
                <button onclick="closeRound()" id="closeBtn" class="btn-reset">Close Round</button>
            </div>
            <div id="textProgress" class="text-progress" role="status" aria-live="polite"></div>
            <details open class="judge-audience-config">
                <summary style="cursor:pointer;font-size:var(--text-caption);margin-bottom:0.5rem;">Judge/Audience Config</summary>
                <label class="config-checkbox">
                    <input type="checkbox" id="toggleQRCheckbox" onchange="toggleAudienceQR(this.checked)"> Display QR to audience
                </label>
                <label class="config-checkbox">
                    <input type="checkbox" id="toggleTimerCheckbox" checked onchange="toggleTimerVisibility(this.checked)"> Display timer to audience/judges
                </label>
                <label class="config-checkbox">
                    <input type="checkbox" id="toggleCanvasCheckbox" onchange="toggleCanvas(this.checked)"> Display canvas to audience/judges
                </label>
                <div id="judgeQRContainer"></div>
            </details>
        </div>
        <div class="story-text-column">
            <div id="osdViewerContainer" style="display: none; position: relative; margin-bottom: 0;">
                <div id="osdViewer" style="width: 100%; height: 100%; background: var(--black);"></div>
                <div id="textOverlay" style="position:absolute;top:0;right:0;bottom:0;width:30%;overflow-y:auto;pointer-events:none;z-index:10;">
                    <div id="metadataParagraphs" aria-live="polite" aria-relevant="additions"></div>
                </div>
            </div>
            <div class="story-text" id="liveStoryText">
                <span class="empty-text">Item text appears here during round...</span>
            </div>
            <div class="outcome" id="outcome" role="alert" aria-live="assertive"></div>
        </div>
    </div>

    <!-- Item management (expanded by default) -->
    <div class="collapsible story-management" id="storyManagement">
        <h2 onclick="toggleSection('storyManagement')">
            <span class="arrow">&#9660;</span>
            Item Queue
        </h2>
        <div class="section-content">
            <div class="management-section">
                <ul class="story-queue" id="mgmtItemQueue"></ul>
            </div>

            <div class="management-section">
                <button onclick="addNewItem()" class="btn-add-story" style="font-size:var(--text-caption);padding:0.4rem 0.8rem;">+ Add Item</button>
                <details class="story-edit-details" id="itemEditPanel">
                    <summary style="cursor:pointer;font-size:var(--text-caption);opacity:0.7;" id="itemFormTitle">Add / Edit Item</summary>
                    <div class="form-group">
                        <label>Title:</label>
                        <input type="text" id="itemTitleInput" placeholder="Item title">
                    </div>
                    <div class="form-group">
                        <label>IIIF Manifest URL (optional):</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input type="text" id="manifestUrl" placeholder="https://example.org/manifest.json" style="flex: 1;">
                            <button type="button" id="fetchManifestBtn" onclick="fetchManifestUrl()">Fetch</button>
                        </div>
                        <span id="manifestStatus" style="font-size: var(--text-caption); display: block; margin-top: 0.25rem;"></span>
                    </div>
                    <div class="form-group">
                        <label>Text:</label>
                        <textarea id="itemText" placeholder="Item text..."></textarea>
                    </div>
                    <div class="edit-actions">
                        <button onclick="saveItem()" id="saveItemBtn" disabled>Update</button>
                        <button onclick="removeEditingItem()" id="removeItemBtn" class="btn-reset">Remove</button>
                    </div>
                </details>
                <details style="margin-top: 0.5rem;">
                    <summary style="cursor:pointer;font-size:var(--text-caption);opacity:0.7;">Import / Export</summary>
                    <div style="margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem;">
                        <textarea id="importExportJson" placeholder="Paste JSON here to import..." style="min-height:150px;font-size:var(--text-caption);"></textarea>
                        <div class="queue-actions">
                            <button onclick="exportSession()" style="font-size:var(--text-caption);padding:0.4rem 0.8rem;">Export JSON</button>
                            <button onclick="importSession()" id="importBtn" style="font-size:var(--text-caption);padding:0.4rem 0.8rem;" disabled>Import JSON</button>
                        </div>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <!-- TERTIARY: History (collapsed by default) -->
    <div class="collapsible collapsed" id="historySection">
        <h2 onclick="toggleSection('historySection')">
            <span class="arrow">&#9660;</span>
            History
        </h2>
        <div class="section-content">
            <button onclick="copyHistory()" class="btn-copy-json">Copy JSON</button>
            <ul class="history-list" id="historyList"></ul>
        </div>
    </div>

    </main>

    <footer class="page-footer">
        <!-- Session management (collapsed, danger zone) -->
        <div class="collapsible session-management collapsed" id="sessionManagementSection">
            <h2 onclick="toggleSection('sessionManagementSection')">
                <span class="arrow">&#9660;</span>
                Session Management (Danger Zone)
            </h2>
            <div class="section-content">
                <button class="danger-btn" onclick="ejectJudges()">Eject All Judges</button>
                <button class="danger-btn" onclick="shutdownAudience()">Shutdown All Audience</button>
                <button class="danger-btn" onclick="deleteSession()">Delete Session</button>
            </div>
        </div>
    </footer>

    <script src="lib/qrcode-generator.js"></script>
    <script src="sounds.js"></script>
    <script src="app.js"></script>
    <script>
        const params = getUrlParams();
        const client = new SpecIdolClient();
        let sessionState = null;
        let editingItemIndex = null;
        let currentLineProgress = { position: 0, total: 0 };
        let audienceQRVisible = false;
        let timer = null;
        let countdown = null;
        let formDirty = false;

        // --- OSD viewer ---
        let osdViewer = null;
        let formCanvases = [];
        let canvasMode = false;

        function osdIcon(svg) {
            return 'data:image/svg+xml,' + encodeURIComponent(
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">${svg}</svg>`
            );
        }

        const OSD_NAV_IMAGES = {
            zoomIn: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#0f0" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#0f0" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#0f0" stroke-width="3"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#0f0" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#0f0" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#0f0" stroke-width="3"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#0f0" stroke="#0f0" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#1a1a1a" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#1a1a1a" stroke-width="3"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#f00" stroke="#0f0" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#fff" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#fff" stroke-width="3"/>')
            },
            zoomOut: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#0f0" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#0f0" stroke-width="3"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#0f0" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#0f0" stroke-width="3"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#0f0" stroke="#0f0" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#1a1a1a" stroke-width="3"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#f00" stroke="#0f0" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#fff" stroke-width="3"/>')
            },
            home: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#0f0" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#0f0" stroke-width="2"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#0f0" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#0f0" stroke-width="2"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#0f0" stroke="#0f0" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#1a1a1a" stroke-width="2"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#f00" stroke="#0f0" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#fff" stroke-width="2"/>')
            },
            fullpage: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#0f0" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#0f0" stroke-width="2"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#0f0" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#0f0" stroke-width="2"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#0f0" stroke="#0f0" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#1a1a1a" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#1a1a1a" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#1a1a1a" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#1a1a1a" stroke-width="2"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#f00" stroke="#0f0" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#fff" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#fff" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#fff" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#fff" stroke-width="2"/>')
            }
        };

        function getTileSource(canvas) {
            if (canvas.service_url) return canvas.service_url + '/info.json';
            return { type: 'image', url: canvas.image_url };
        }

        function initOsdViewer(canvas) {
            destroyOsdViewer();
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            osdViewer = OpenSeadragon({
                element: document.getElementById('osdViewer'),
                tileSources: getTileSource(canvas),
                showNavigator: false,
                showNavigationControl: true,
                gestureSettingsMouse: { scrollToZoom: true },
                animationTime: prefersReducedMotion ? 0 : 1.2,
                springStiffness: prefersReducedMotion ? 100 : 6.5,
                prefixUrl: '',
                navImages: OSD_NAV_IMAGES
            });
        }

        function destroyOsdViewer() {
            if (osdViewer) { osdViewer.destroy(); osdViewer = null; }
        }

        function showCanvasLabel(label) {
            const el = document.getElementById('canvasLabel');
            if (!el) return;
            if (label) { el.textContent = label; el.style.display = 'block'; }
            else { el.style.display = 'none'; }
        }

        function applyCanvasMode() {
            const osdContainer = document.getElementById('osdViewerContainer');
            const textContainer = document.querySelector('.story-text');
            const col = document.querySelector('.story-text-column');
            if (canvasMode) {
                osdContainer.style.display = 'flex';
                textContainer.style.display = 'none';
                col.style.padding = '0';
                col.style.overflow = 'hidden';
            } else {
                osdContainer.style.display = 'none';
                textContainer.style.display = '';
                col.style.padding = '';
                col.style.overflow = '';
            }
        }

        function appendOverlayParagraph(text) {
            const container = document.getElementById('metadataParagraphs');
            const div = document.createElement('div');
            div.className = 'overlay-paragraph';
            div.textContent = text;
            container.appendChild(div);
            const overlay = document.getElementById('textOverlay');
            setTimeout(() => { overlay.scrollTop = overlay.scrollHeight; }, 100);
        }

        function fetchManifestUrl() {
            const url = document.getElementById('manifestUrl').value.trim();
            if (!url) return;
            document.getElementById('manifestStatus').textContent = 'Fetching...';
            client.fetchManifest(url);
        }

        function advanceCanvas(direction) {
            client.canvasAdvance(direction);
        }

        function updateCanvasControls(canvasIndex, totalCanvases) {
            const prev = document.getElementById('prevCanvasBtn');
            const next = document.getElementById('nextCanvasBtn');
            const progress = document.getElementById('canvasProgress');
            if (totalCanvases > 1) {
                prev.style.display = '';
                next.style.display = '';
                progress.style.display = '';
                progress.textContent = `Canvas ${canvasIndex + 1} / ${totalCanvases}`;
                prev.disabled = (canvasIndex <= 0);
                next.disabled = (canvasIndex >= totalCanvases - 1);
            } else {
                prev.style.display = 'none';
                next.style.display = 'none';
                progress.style.display = 'none';
            }
        }

        client.connect();

        client.onConnect = () => {
            if (params.code) {
                client.joinSession(params.code, 'controller');
            } else {
                client.createSession();
            }
        };

        client.on('session_created', (data) => {
            document.getElementById('sessionCode').textContent = data.code;
            // Update URL to include code
            const newUrl = new URL(window.location);
            newUrl.searchParams.set('code', data.code);
            window.history.replaceState({}, '', newUrl);
            // Join as controller
            client.joinSession(data.code, 'controller');
        });

        client.on('session_state', (data) => {
            sessionState = data;
            updateUI();
            updateSessionCounts(data);

            // Initialize status on page load
            const hasItem = sessionState.current_round.item_index !== null;
            if (!hasItem && sessionState.current_round.status === 'waiting') {
                updateStatus('waiting'); // Will show "select an item"
            }

            // Generate judge QR code
            const sessionCode = data.code;
            const judgeURL = `${window.location.origin}/judge.html?code=${sessionCode}`;
            const qrEl = createQRElement(judgeURL, sessionCode, 200);
            const qrContainer = document.getElementById('judgeQRContainer');
            qrContainer.innerHTML = '';
            qrContainer.appendChild(qrEl);

            // Click QR to open judge page in new tab
            qrContainer.style.cursor = 'pointer';
            qrContainer.title = 'Click to open judge page';
            qrContainer.onclick = () => window.open(judgeURL, '_blank');

            // Set audience QR toggle state
            audienceQRVisible = data.audience_qr_visible !== false;
            document.getElementById('toggleQRCheckbox').checked = audienceQRVisible;

            // Set timer visibility toggle state
            const timerVisible = data.timer_visible !== false;
            document.getElementById('toggleTimerCheckbox').checked = timerVisible;

            // Set canvas visibility toggle state
            const canvasVisible = data.canvas_visible === true;
            document.getElementById('toggleCanvasCheckbox').checked = canvasVisible;
            canvasMode = canvasVisible;
            applyCanvasMode();
        });

        client.on('judge_joined', (data) => {
            if (sessionState) {
                updateSessionCounts({connected_judges: data.connected_judges});
            }
        });

        client.on('judge_left', (data) => {
            if (sessionState) {
                updateSessionCounts({connected_judges: data.connected_judges});
            }
        });

        client.on('audience_joined', (data) => {
            if (sessionState) {
                updateSessionCounts({audience_count: data.audience_count});
            }
        });

        client.on('audience_left', (data) => {
            if (sessionState) {
                updateSessionCounts({audience_count: data.audience_count});
            }
        });

        client.on('countdown_start', (data) => {
            // Track title for history
            if (sessionState) {
                sessionState.current_round.title = data.item_title;
                sessionState.current_round.status = 'countdown';
                renderMgmtQueue();
            }

            // Reset timer and outcome
            hideOutcome();
            if (timer) timer.stop();
            const timerEl = document.getElementById('headerTimer');
            timerEl.style.display = 'flex';
            timerEl.textContent = '0:00.0';

            // Clear overlay paragraphs
            document.getElementById('metadataParagraphs').innerHTML = '';

            // Show OSD if canvases present
            if (data.canvases && data.canvases.length > 0) {
                initOsdViewer(data.canvases[0]);
                updateCanvasControls(0, data.canvases.length);
            }
            applyCanvasMode();

            // Show first paragraph in correct container
            const firstParagraph = data.first_paragraph || data.first_line;
            if (firstParagraph) {
                if (canvasMode && osdViewer) {
                    appendOverlayParagraph(firstParagraph);
                } else {
                    document.getElementById('liveStoryText').innerHTML = '';
                    appendStoryLine(firstParagraph);
                }
            }

            // Show countdown
            if (countdown) countdown.cancel();
            countdown = new Countdown('countdown-container', () => {
                // Countdown complete — tell server to start the round
                const itemIdx = data.item_index !== undefined
                    ? data.item_index
                    : (sessionState ? sessionState.current_round.item_index : 0);
                client.startRound(itemIdx);
            });
            countdown.start();
        });

        client.on('buzzed', (data) => {
            // Play buzz sound
            if (client.judgeSounds) {
                const soundIndex = client.judgeSounds[data.judge_id];
                if (soundIndex !== undefined) {
                    playBuzz(soundIndex, data.buzz_count || 1);
                }
            }

            // Check for final combo (all judges buzzed)
            if (sessionState) {
                const totalJudges = Object.keys(client.judgeSounds || {}).length;
                const buzzedCount = data.total_buzzed || 0;
                if (buzzedCount >= totalJudges && totalJudges > 0) {
                    setTimeout(() => {
                        playFinalCombo(Object.values(client.judgeSounds || {}));
                    }, 900);
                }
            }
        });

        client.on('item_added', (data) => {
            // Controller already updates local state in addItem().
            // This handler covers items added by import or future multi-controller.
            if (sessionState && data.index >= sessionState.items.length) {
                sessionState.items.push({title: data.title, text: ''});
                renderMgmtQueue();
            }
            updateSessionCounts({items: sessionState.items});
        });

        client.on('item_removed', (data) => {
            if (sessionState && data.index < sessionState.items.length) {
                sessionState.items.splice(data.index, 1);
                renderMgmtQueue();
                // If we were editing the removed item, close edit panel
                if (editingItemIndex === data.index) {
                    editingItemIndex = null;
                    document.getElementById('itemEditPanel').open = false;
                } else if (editingItemIndex !== null && editingItemIndex > data.index) {
                    editingItemIndex--;
                }
            }
            updateSessionCounts({items: sessionState.items});
        });

        client.on('items_update', (data) => {
            if (sessionState) {
                sessionState.items = data.items;
                renderMgmtQueue();
                updateSessionCounts({items: data.items});
            }
        });

        client.on('manifest_fetched', (data) => {
            const status = document.getElementById('manifestStatus');
            if (data.error) {
                status.textContent = 'Error: ' + data.error;
                formCanvases = [];
                return;
            }
            formCanvases = data.canvases || [];
            status.textContent = formCanvases.length + ' canvas(es) found';
            if (data.metadata) {
                const titleInput = document.getElementById('itemTitleInput');
                const textInput = document.getElementById('itemText');
                if (titleInput && !titleInput.value && data.metadata.label) {
                    titleInput.value = data.metadata.label;
                }
                if (textInput && !textInput.value && data.metadata.metadata_text) {
                    textInput.value = data.metadata.metadata_text;
                }
            }
        });

        client.on('canvas_advanced', (data) => {
            if (data.canvas) {
                showCanvasLabel(data.canvas.label);
                if (osdViewer) {
                    osdViewer.open(getTileSource(data.canvas));
                } else {
                    initOsdViewer(data.canvas);
                }
            }
            if (data.canvas_index !== undefined && data.total_canvases !== undefined) {
                updateCanvasControls(data.canvas_index, data.total_canvases);
            }
        });

        client.on('round_started', (data) => {
            if (data.server_time) updateClockOffset(data.server_time);
            updateStatus('running');

            // Start header timer
            const timerEl = document.getElementById('headerTimer');
            timerEl.style.display = 'flex';
            if (timer) timer.stop();
            timer = new Timer(Infinity, (elapsed) => {
                timerEl.textContent = formatTime(elapsed);
            });
            timer.start(data.start_time || (Date.now() / 1000));

            if (sessionState) {
                sessionState.current_round.status = 'running';
                sessionState.current_round.text_paragraph_count = data.text_paragraph_count || data.text_line_count || 0;
                renderMgmtQueue();
            }
            updateSelectedItemDisplay();
            updateTextProgress(0, data.text_paragraph_count || data.text_line_count || 0);
        });

        client.on('text_advanced', (data) => {
            updateTextProgress(data.position + 1, data.total);
            const text = data.paragraph || data.line;
            if (canvasMode && osdViewer) {
                appendOverlayParagraph(text);
            } else {
                appendStoryLine(text);
            }
        });

        client.on('paused', (data) => {
            updateStatus('paused', currentLineProgress.position, currentLineProgress.total);
            if (timer) timer.pause();
            if (sessionState) {
                sessionState.current_round.status = 'paused';
                renderMgmtQueue();
            }
        });

        client.on('resumed', (data) => {
            updateStatus('running', currentLineProgress.position, currentLineProgress.total);
            if (timer) timer.resume(data.timestamp - data.elapsed);
            if (sessionState) {
                sessionState.current_round.status = 'running';
                renderMgmtQueue();
            }
        });

        client.on('round_ended', (data) => {
            updateStatus('ended');
            if (timer) timer.stop();
            showOutcome(data.outcome);
            if (data.outcome === 'victory') {
                playVictoryFanfare();
            }
            if (sessionState) {
                sessionState.current_round.status = 'ended';
                sessionState.history.push({
                    title: sessionState.current_round.title,
                    ...data
                });
                renderHistory();
                renderMgmtQueue();
            }
        });

        client.on('round_reset', () => {
            updateStatus('waiting');
            hideOutcome();
            clearItemText();
            currentLineProgress = { position: 0, total: 0 };
            if (timer) timer.stop();
            if (countdown) countdown.cancel();
            document.getElementById('headerTimer').style.display = 'none';
            // Destroy OSD and hide canvas controls
            destroyOsdViewer();
            document.getElementById('osdViewerContainer').style.display = 'none';
            updateCanvasControls(0, 0);
            if (sessionState) {
                sessionState.current_round.status = 'waiting';
                sessionState.current_round.item_index = null;
                updateSelectedItemDisplay();
                renderMgmtQueue();
            }
        });

        client.on('session_imported', async (data) => {
            await customAlert(`Imported ${(data.items || []).length} items`);
            // Trigger refresh by requesting session state
            if (params.code) {
                client.joinSession(params.code, 'controller');
            }
        });

        client.on('error', async (data) => {
            if (data.message === 'Invalid session code') {
                await customAlert('Session no longer exists. Returning to home.');
                window.location.href = 'index.html';
            }
        });

        function updateUI() {
            if (!sessionState) return;

            document.getElementById('sessionCode').textContent = sessionState.code || '----';
            renderMgmtQueue();
            renderHistory();
            updateStatus(sessionState.current_round.status);
            updateSelectedItemDisplay();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (!sessionState || sessionState.history.length === 0) {
                list.innerHTML = '<li style="opacity: 0.7; text-align: center; padding: 1rem;">No rounds completed yet. Start a round to build history.</li>';
                return;
            }

            list.innerHTML = sessionState.history.map(entry => {
                const buzzCount = entry.buzzes ? entry.buzzes.length : 0;
                const buzzHistory = entry.buzz_history || [];
                const buzzDetails = buzzHistory.map(b =>
                    `${escapeHtml(b.judge_name)} @ ${b.time}s`
                ).join(', ');
                const buzzInfo = buzzDetails ? ` [${buzzDetails}]` : '';
                return `
                    <li class="history-item ${entry.outcome}">
                        ${escapeHtml(entry.title)} — ${entry.outcome.toUpperCase()}
                        <span style="font-size: var(--text-caption); opacity: 0.7;">(${entry.duration}s, ${buzzCount} buzz${buzzCount !== 1 ? 'es' : ''}${buzzInfo})</span>
                    </li>
                `;
            }).join('');
        }

        function updateStatus(status, position = null, total = null) {
            const statusEl = document.getElementById('currentStatus');

            let statusText;
            if ((status === 'running' || status === 'paused') && position !== null && total !== null && position > 0) {
                const statusWord = status === 'paused' ? 'paused' : 'running';
                statusText = `Status: ${statusWord}, part ${position}/${total}`;
            } else if (status === 'waiting') {
                const hasItem = sessionState && sessionState.current_round.item_index !== null;
                statusText = hasItem ? 'Status: waiting' : 'Status: select an item';
            } else {
                // For other states, check if item is selected
                const hasItem = sessionState && sessionState.current_round.item_index !== null;
                statusText = hasItem ? `Status: ${status}` : 'Status: select an item';
            }

            statusEl.textContent = statusText;
            statusEl.dataset.status = status;

            const controlsCol = document.querySelector('.round-controls-column');
            if (controlsCol) controlsCol.dataset.status = status;

            const startBtn = document.getElementById('startBtn');
            const advanceBtn = document.getElementById('advanceBtn');
            const pauseBtn = document.getElementById('pauseBtn');

            startBtn.disabled = (status === 'running' || status === 'paused');
            advanceBtn.disabled = (status !== 'running');
            pauseBtn.disabled = (status !== 'running' && status !== 'paused');
            pauseBtn.textContent = (status === 'paused') ? 'Resume' : 'Pause';
        }

        function updateTextProgress(position, total) {
            currentLineProgress = { position, total };
            if (sessionState && sessionState.current_round.status === 'running') {
                updateStatus('running', position, total);
            }
        }

        function appendStoryLine(line) {
            const textEl = document.getElementById('liveStoryText');
            // Clear placeholder on first line
            const placeholder = textEl.querySelector('.empty-text');
            if (placeholder) placeholder.remove();

            const lineSpan = document.createElement('span');
            lineSpan.className = 'text-line';
            lineSpan.textContent = line;

            if (textEl.children.length > 0) {
                const br = document.createElement('br');
                textEl.appendChild(br);
            }
            textEl.appendChild(lineSpan);

            setTimeout(() => {
                lineSpan.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function showOutcome(outcome) {
            const el = document.getElementById('outcome');
            el.textContent = outcome === 'victory' ? 'SURVIVOR!' : 'BUZZED OUT';
            el.className = `outcome ${outcome}`;
            el.style.display = 'block';
        }

        function hideOutcome() {
            document.getElementById('outcome').style.display = 'none';
        }

        function clearItemText() {
            const textEl = document.getElementById('liveStoryText');
            const index = sessionState ? sessionState.current_round.item_index : null;

            if (index !== null && sessionState.items[index]) {
                // Show dimmed preview of full item text
                textEl.innerHTML = '';
                const preview = document.createElement('div');
                preview.style.opacity = '0.3';
                preview.style.whiteSpace = 'pre-wrap';
                preview.style.lineHeight = '1.7';
                preview.textContent = sessionState.items[index].text;
                textEl.appendChild(preview);
            } else {
                textEl.innerHTML = '<span class="empty-text">Item text appears here during round...</span>';
            }
            // Clear overlay paragraphs
            document.getElementById('metadataParagraphs').innerHTML = '';
        }

        // --- Item management (2-column: queue left, edit form right) ---

        function renderMgmtQueue() {
            const queue = document.getElementById('mgmtItemQueue');
            if (!sessionState || !sessionState.items || sessionState.items.length === 0) {
                queue.innerHTML = `
                    <li class="empty-state">
                        No items yet.
                        <span class="cta">Click "+ Add Item" below &#8595;</span>
                    </li>
                `;
                return;
            }

            const status = sessionState.current_round.status;
            const roundActive = status === 'running' || status === 'paused';

            queue.innerHTML = sessionState.items.map((item, i) => {
                const isCurrent = i === sessionState.current_round.item_index;
                const editingClass = i === editingItemIndex ? 'editing' : '';
                const disabledClass = roundActive ? 'disabled' : '';

                // Determine status marker
                let statusHtml = '';
                const roundStatus = sessionState.current_round.status;
                if (isCurrent && (roundStatus === 'running' || roundStatus === 'countdown')) {
                    statusHtml = '<span class="story-status running">RUNNING</span>';
                } else if (isCurrent && roundStatus === 'paused') {
                    statusHtml = '<span class="story-status paused">PAUSED</span>';
                } else if (sessionState.history) {
                    const entry = sessionState.history.find(h => h.title === item.title);
                    if (entry && entry.outcome === 'victory') {
                        statusHtml = '<span class="story-status victory">SURVIVOR</span>';
                    } else if (entry && entry.outcome === 'defeat') {
                        statusHtml = '<span class="story-status defeat">BUZZED OUT</span>';
                    }
                }

                return `
                    <li class="story-item ${isCurrent ? 'current' : ''} ${editingClass} ${disabledClass}" onclick="selectItem(${i})">
                        <div class="story-info">
                            <strong>${i + 1}. ${escapeHtml(item.title)}</strong>
                        </div>
                        ${statusHtml}
                    </li>
                `;
            }).join('');
        }

        function editItem(index) {
            if (!sessionState || !sessionState.items[index]) return;

            const item = sessionState.items[index];
            document.getElementById('itemTitleInput').value = item.title;
            document.getElementById('itemText').value = item.text;
            document.getElementById('manifestUrl').value = item.manifest_url || '';
            document.getElementById('manifestStatus').textContent = '';
            formCanvases = item.canvases || [];
            editingItemIndex = index;
            formDirty = false;

            document.getElementById('itemFormTitle').textContent = 'Edit: ' + item.title;
            document.getElementById('saveItemBtn').textContent = 'Update';
            document.getElementById('saveItemBtn').disabled = true;
            document.getElementById('removeItemBtn').style.display = '';

            renderMgmtQueue();
        }

        function addNewItem() {
            editingItemIndex = null;
            formDirty = false;
            document.getElementById('itemTitleInput').value = '';
            document.getElementById('itemText').value = '';
            document.getElementById('manifestUrl').value = '';
            document.getElementById('manifestStatus').textContent = '';
            formCanvases = [];

            const panel = document.getElementById('itemEditPanel');
            panel.open = true;
            document.getElementById('itemFormTitle').textContent = 'Add Item';
            document.getElementById('saveItemBtn').textContent = 'Create';
            document.getElementById('saveItemBtn').disabled = false;
            document.getElementById('removeItemBtn').style.display = 'none';

            renderMgmtQueue();
        }

        // Enable import button when textarea has content
        document.getElementById('importExportJson').addEventListener('input', updateImportBtnState);

        // Enable save button on edits
        document.getElementById('itemTitleInput').addEventListener('input', () => {
            formDirty = true;
            document.getElementById('saveItemBtn').disabled = false;
        });
        document.getElementById('itemText').addEventListener('input', () => {
            formDirty = true;
            document.getElementById('saveItemBtn').disabled = false;
        });

        async function saveItem() {
            const title = document.getElementById('itemTitleInput').value.trim();
            const text = document.getElementById('itemText').value.trim();
            const manifestUrl = document.getElementById('manifestUrl').value.trim();

            if (!title || !text) {
                await customAlert('Enter both title and text');
                return;
            }

            if (title.length > 200) {
                await customAlert('Title too long (max 200 characters)');
                return;
            }
            if (text.length > 10000) {
                await customAlert('Text too long (max 10,000 characters)');
                return;
            }

            if (editingItemIndex !== null) {
                // Update existing item
                client.send('update_item', {
                    item_index: editingItemIndex,
                    title: title,
                    text: text,
                    manifest_url: manifestUrl || null,
                    canvases: formCanvases
                });
                // Optimistic local update
                sessionState.items[editingItemIndex] = {title, text, manifest_url: manifestUrl || null, canvases: formCanvases};
                renderMgmtQueue();
            } else {
                // Add new item
                const wasEmpty = !sessionState || sessionState.items.length === 0;
                client.addItem(title, text, manifestUrl || null, formCanvases);
                if (sessionState) {
                    sessionState.items.push({title, text, manifest_url: manifestUrl || null, canvases: formCanvases});
                    renderMgmtQueue();
                    if (wasEmpty) {
                        document.getElementById('storyManagement').classList.add('collapsed');
                    }
                }
            }

            document.getElementById('saveItemBtn').disabled = true;
            formDirty = false;
        }

        async function removeEditingItem() {
            if (editingItemIndex === null) return;
            if (await customConfirm('Remove this item?')) {
                client.removeItem(editingItemIndex);
                document.getElementById('itemEditPanel').open = false;
                editingItemIndex = null;
            }
        }

        async function selectItem(index) {
            if (!sessionState) return;

            // Block item selection during active round
            const status = sessionState.current_round.status;
            if (status === 'running' || status === 'paused') {
                await customAlert('Cannot change item during active round. Close round or wait for it to end.');
                return;
            }

            sessionState.current_round.item_index = index;
            sessionState.current_round.title = sessionState.items[index].title;
            updateSelectedItemDisplay();
            clearItemText();
            editItem(index);
        }

        function updateSelectedItemDisplay() {
            const headerEl = document.getElementById('headerItemTitle');
            if (!sessionState) return;

            const index = sessionState.current_round.item_index;
            if (index !== null && sessionState.items[index]) {
                const title = sessionState.items[index].title;
                headerEl.textContent = title;
                headerEl.classList.remove('waiting');

                // Update status when item selected
                const currentStatus = sessionState.current_round.status;
                if (currentStatus === 'waiting' || currentStatus === 'ended') {
                    updateStatus('waiting');
                }
            } else {
                headerEl.textContent = 'No item selected';
                headerEl.classList.add('waiting');

                // Update status when no item selected
                updateStatus('waiting'); // Will become "select an item" in updateStatus
            }
        }

        function toggleSection(id) {
            document.getElementById(id).classList.toggle('collapsed');
        }


        async function startRound() {
            const btn = document.getElementById('startBtn');
            if (btn.disabled) return;

            if (!sessionState || sessionState.current_round.item_index === null) {
                await customAlert('Select an item first');
                return;
            }

            btn.disabled = true;
            client.send('countdown_start', { item_index: sessionState.current_round.item_index });
            // Will be re-enabled by round_started event via updateStatus()
        }

        async function closeRound() {
            if (await customConfirm('Close this round early?')) {
                client.resetRound();
            }
        }

        function toggleAudienceQR(visible) {
            audienceQRVisible = visible;
            client.send('toggle_audience_qr', { visible: audienceQRVisible });
        }

        function toggleTimerVisibility(visible) {
            client.send('toggle_timer_visibility', { visible: visible });
        }

        function toggleCanvas(visible) {
            canvasMode = visible;
            applyCanvasMode();
            client.toggleCanvas(visible);
        }

        function advanceText() {
            const btn = document.getElementById('advanceBtn');
            if (btn.disabled) return;

            if (!sessionState || sessionState.current_round.status !== 'running') {
                return;
            }

            // Prevent double-click
            btn.disabled = true;
            client.advanceText();

            // Re-enable after short delay
            setTimeout(() => {
                if (sessionState && sessionState.current_round.status === 'running') {
                    btn.disabled = false;
                }
            }, 300);
        }

        // Keyboard shortcuts: spacebar/right to advance text, up/down for canvas navigation
        document.addEventListener('keydown', (e) => {
            // Don't capture if typing in an input/textarea
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            // Don't capture if modal is open
            const modalOverlay = document.getElementById('modalOverlay');
            if (modalOverlay && modalOverlay.classList.contains('active')) return;

            if (e.code === 'Space' || e.code === 'ArrowRight') {
                e.preventDefault();
                advanceText();
            }
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                advanceCanvas('prev');
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                advanceCanvas('next');
            }
        });

        function togglePause() {
            if (!sessionState) return;
            const status = sessionState.current_round.status;
            if (status === 'running') {
                client.pause();
            } else if (status === 'paused') {
                client.resume();
            }
        }

        function exportSession() {
            if (!sessionState) return;

            const exportData = {
                items: sessionState.items,
                config: sessionState.config
            };

            const json = JSON.stringify(exportData, null, 2);
            const textarea = document.getElementById('importExportJson');
            textarea.value = json;
            updateImportBtnState();

            // Silently copy to clipboard if possible
            try { navigator.clipboard.writeText(json); } catch (e) {}
        }

        async function copyHistory() {
            if (!sessionState || sessionState.history.length === 0) {
                await customAlert('No history to copy yet');
                return;
            }

            const historyJson = JSON.stringify(sessionState.history, null, 2);
            if (await copyToClipboard(historyJson)) {
                await customAlert('History copied to clipboard!');
            } else {
                await customAlert('Copy failed — history logged to console');
                console.log(historyJson);
            }
        }

        async function copyToClipboard(text) {
            // Try modern API first
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (e) {}
            // Fallback: temporary textarea + execCommand
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) {
                return false;
            }
        }

        async function importSession() {
            const textarea = document.getElementById('importExportJson');
            const json = textarea.value.trim();
            if (!json) return;

            try {
                const data = JSON.parse(json);
                client.importSession(data.items || [], data.config || {});
                textarea.value = '';
                updateImportBtnState();
            } catch (e) {
                await customAlert('Invalid JSON: ' + e.message);
            }
        }

        function updateImportBtnState() {
            const textarea = document.getElementById('importExportJson');
            const importBtn = document.getElementById('importBtn');
            if (importBtn) {
                importBtn.disabled = !textarea.value.trim();
            }
        }

        function updateSessionCounts(data) {
            if (data.items !== undefined) {
                document.getElementById('itemCount').textContent = data.items.length;
            }
            if (data.connected_judges !== undefined) {
                document.getElementById('judgeCount').textContent = data.connected_judges.length;
            }
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
        }

        async function ejectJudges() {
            if (await customConfirm('Eject all judges? They will be disconnected with a message.')) {
                client.send('eject_judges');
            }
        }

        async function shutdownAudience() {
            if (await customConfirm('Shutdown all audience screens? They will be disconnected.')) {
                client.send('shutdown_audience');
            }
        }

        async function deleteSession() {
            if (await customConfirm('DELETE SESSION? This will eject all judges, shutdown all audience screens, and delete the session. This cannot be undone.')) {
                client.send('delete_session');
                // Redirect back to home after deletion
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }
        }
    </script>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-buttons">
                <button class="modal-btn" id="modalOk">OK</button>
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="modal.js"></script>
</body>
</html>
