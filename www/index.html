<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOURGEOISIE IDOL</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modal.css">
    <style>
        h1 {
            margin-bottom: 3rem;
            text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .mode-select {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .join-form {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 800px;
        }

        .join-form.active {
            display: grid;
        }

        .sessions-column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #sessionButtons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            align-items: stretch;
        }

        #sessionButtons button {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            min-height: 120px;
        }

        #sessionButtons button .session-code {
            font-size: var(--text-heading);
            margin-bottom: 0.5rem;
        }

        #sessionButtons button .session-stats {
            font-family: 'Courier New', monospace;
            font-size: var(--text-caption);
            margin-top: 0.5rem;
            opacity: 0.7;
            text-align: center;
        }

        .actions-column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .column-header {
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-heading);
            text-align: center;
            margin-bottom: 1rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }

        input[type="text"] {
            text-transform: uppercase;
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-subheading);
            text-align: center;
            letter-spacing: 0.5rem;
        }

        .error {
            color: var(--neon-red);
            text-align: center;
            padding: 0.5rem;
            display: none;
        }

        .error.active {
            display: block;
        }

        .btn-controller {
            background: #440;
            color: var(--neon-yellow);
            border-color: var(--neon-yellow);
            margin-top: 1rem;
        }

        .btn-controller:hover:not(:disabled) {
            background: var(--neon-yellow);
            color: var(--black);
            box-shadow: 0 0 20px var(--neon-yellow);
        }

        @media (max-width: 900px) {
            .join-form {
                grid-template-columns: 1fr;
            }

            #sessionButtons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body class="page-centered">
    <header class="page-header">
        <h1>BOURGEOISIE<br>IDOL</h1>
    </header>

    <main class="page-content">
        <div class="container">
            <div class="mode-select" id="modeSelect">
                <button onclick="createSession()">Create Session</button>
                <button onclick="showJoinForm()">Join Session</button>
            </div>

            <div class="join-form" id="joinForm">
                <div class="sessions-column">
                    <div class="column-header">Select Session</div>
                    <div id="sessionButtons"></div>
                </div>

                <div class="actions-column">
                    <div class="column-header">Join As</div>
                    <button onclick="joinAsAudience()" id="joinAudienceBtn" disabled>Join as Audience</button>
                    <button onclick="joinAsJudge()" id="joinJudgeBtn" disabled>Join as Judge</button>
                    <button onclick="joinAsController()" id="joinControllerBtn" disabled class="btn-controller">Join as Controller</button>
                </div>
            </div>

            <div class="error" id="error"></div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-buttons">
                <button class="modal-btn" id="modalOk">OK</button>
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="modal.js"></script>
    <script>
        const client = new SpecIdolClient();
        let selectedCode = null;

        client.connect();

        client.on('session_created', (data) => {
            window.location.href = `control.html?code=${data.code}`;
        });

        client.on('sessions_list', (data) => {
            renderSessions(data.sessions);
        });

        function createSession() {
            client.createSession();
        }

        function showJoinForm() {
            document.getElementById('modeSelect').style.display = 'none';
            document.getElementById('joinForm').classList.add('active');
            client.listSessions();
        }

        function renderSessions(sessions) {
            const container = document.getElementById('sessionButtons');
            if (sessions.length === 0) {
                container.innerHTML = '<div style="text-align: center; opacity: 0.7; padding: 2rem;">No active sessions</div>';
                return;
            }

            container.innerHTML = '';
            sessions.forEach(session => {
                const btn = document.createElement('button');
                btn.addEventListener('click', () => selectSession(session.code));
                btn.innerHTML = `
                    <div class="session-code">${escapeHtml(session.code)}</div>
                    <div class="session-stats">
                        ${session.item_count} items | ${session.judge_count} judges | ${session.audience_count} audience
                    </div>
                `;
                container.appendChild(btn);
            });
        }

        function selectSession(code) {
            selectedCode = code;
            document.getElementById('joinControllerBtn').disabled = false;
            document.getElementById('joinAudienceBtn').disabled = false;
            document.getElementById('joinJudgeBtn').disabled = false;
            document.querySelectorAll('#sessionButtons button').forEach(btn => {
                const isSelected = btn.querySelector('.session-code').textContent === code;
                btn.style.background = isSelected ? 'var(--soviet-ochre)' : 'var(--soviet-concrete)';
                btn.style.color = isSelected ? 'var(--soviet-concrete)' : 'var(--soviet-ochre)';
            });
        }

        async function joinAsController() {
            if (!selectedCode) return;
            if (await customConfirm("Are you sure you're fair enough to seize control?")) {
                window.location.href = `control.html?code=${selectedCode}`;
            }
        }

        async function joinAsAudience() {
            if (!selectedCode) return;
            if (await customConfirm("Do you like to watch?")) {
                window.location.href = `audience.html?code=${selectedCode}`;
            }
        }

        async function joinAsJudge() {
            if (!selectedCode) return;
            if (await customConfirm("Is your opinion the truth?")) {
                window.location.href = `judge.html?code=${selectedCode}`;
            }
        }

        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = message;
            error.classList.add('active');
        }

        function clearError() {
            document.getElementById('error').classList.remove('active');
        }
    </script>
</body>
</html>
