<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECULATIVE IDOL</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        h1 {
            margin-bottom: 2rem;
            text-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
            text-align: center;
        }

        .session-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 900px;
        }

        .session-card {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--neon-green);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .session-card:hover {
            border-color: var(--neon-yellow);
            box-shadow: 0 0 20px var(--neon-yellow);
        }

        .session-card .qr-code {
            margin-bottom: 1rem;
        }

        .session-card .qr-code img {
            display: inline-block;
        }

        .session-card .session-code {
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-heading);
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
            margin-bottom: 0.5rem;
        }

        .session-card .session-stats {
            font-family: 'Courier New', monospace;
            font-size: var(--text-caption);
            color: var(--neon-green);
            opacity: 0.7;
        }

        .session-card .tap-hint {
            font-family: 'Courier New', monospace;
            font-size: var(--text-caption);
            color: var(--neon-green);
            opacity: 0.5;
            margin-top: 0.75rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            opacity: 0.7;
            line-height: 2;
            max-width: 500px;
        }

        .btn-create {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--neon-green);
            color: var(--black);
            border: 2px solid var(--neon-green);
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-caption);
            padding: 0.5rem 1rem;
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-green);
            text-transform: uppercase;
            z-index: 100;
        }

        .btn-create:hover {
            background: var(--black);
            color: var(--neon-green);
        }

        @media (max-width: 900px) {
            .session-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>SPECULATIVE<br>IDOL</h1>

    <div id="sessionGrid" class="session-grid"></div>
    <div id="emptyState" class="empty-state" style="display: none;">
        No active sessions.<br>
        Create one to get started.
    </div>

    <button class="btn-create" onclick="createSession()">Create Session</button>

    <script src="lib/qrcode-generator.js"></script>
    <script src="app.js"></script>
    <script>
        const client = new SpecIdolClient();

        client.connect();

        client.onConnect = () => {
            client.listSessions();
        };

        client.on('session_created', (data) => {
            window.location.href = `control.html?code=${data.code}`;
        });

        client.on('sessions_list', (data) => {
            renderSessions(data.sessions);
        });

        function createSession() {
            client.createSession();
        }

        function renderSessions(sessions) {
            const grid = document.getElementById('sessionGrid');
            const emptyState = document.getElementById('emptyState');

            if (sessions.length === 0) {
                grid.innerHTML = '';
                emptyState.style.display = '';
                return;
            }

            emptyState.style.display = 'none';
            grid.innerHTML = '';

            sessions.forEach(session => {
                const card = document.createElement('div');
                card.className = 'session-card';

                // QR code → audience join URL
                const joinURL = `${window.location.origin}/audience.html?code=${session.code}`;
                const qrEl = createQRElement(joinURL, session.code, 200);

                const code = document.createElement('div');
                code.className = 'session-code';
                code.textContent = session.code;

                const stats = document.createElement('div');
                stats.className = 'session-stats';
                stats.textContent = `${session.judge_count} judges · ${session.story_count} stories · ${session.audience_count} audience`;

                const hint = document.createElement('div');
                hint.className = 'tap-hint';
                hint.textContent = 'Scan QR or tap to join as audience';

                card.appendChild(qrEl);
                card.appendChild(code);
                card.appendChild(stats);
                card.appendChild(hint);

                // Click card → join as audience directly
                card.addEventListener('click', () => {
                    window.location.href = `audience.html?code=${session.code}`;
                });

                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
