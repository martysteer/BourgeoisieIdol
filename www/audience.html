<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Audience - SPECULATIVE IDOL</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modal.css">
    <style>
        body {
            position: relative;
        }

        /* CRT scanline effect */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .page-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0 2rem;
        }


        .story-text-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .story-text {
            font-size: 2rem;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .text-line {
            display: block;
            opacity: 0;
            transform: translateY(20px);
            animation: lineAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; /* ease-out-expo */
        }

        @keyframes lineAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .outcome {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', cursive;
            font-size: calc(var(--text-display) * 3);
            z-index: 100;
            text-align: center;
            line-height: 1.2;
        }

        .outcome.victory {
            color: var(--neon-green);
            text-shadow: 0 0 20px var(--neon-green);
            animation: victoryAnim 1s ease-out;
        }

        .outcome.defeat {
            color: var(--neon-red);
            text-shadow: 0 0 20px var(--neon-red);
            animation: defeatAnim 0.8s ease-out;
        }

        @keyframes victoryAnim {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes defeatAnim {
            0% { transform: translate(-50%, -100vh); opacity: 0; }
            60% { transform: translate(-50%, -40%); opacity: 1; }
            100% { transform: translate(-50%, -50%); }
        }

        body.defeat-flash {
            animation: flashRed 0.5s;
        }

        @keyframes flashRed {
            0%, 100% { background: var(--black); }
            50% { background: #300; }
        }

        @media (max-width: 900px) {
            .page-content {
                padding: 0 0.5rem;
            }

            .story-text-container {
                padding: 0.5rem;
            }

            .story-text {
                font-size: 1.2rem;
            }

            .outcome {
                font-size: clamp(1.5rem, 8vw, calc(var(--text-display) * 2));
                white-space: nowrap;
            }

            .judge-cell {
                padding: 0.5rem 0.75rem;
            }
        }

        .header-timer.timer-force-hidden {
            display: none !important;
        }
    </style>
</head>
<body class="page-locked">
    <div id="countdown-container" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:1000;"></div>

    <header class="page-header">
        <div class="header-left">
            <div class="page-label">WATCHING</div>
            <div class="header-info">
                <span id="sessionCode">----</span> |
                <span id="storyCount">0</span> stories |
                <span id="judgeCount">0</span> judges |
                <span id="audienceCount">0</span> audience
            </div>
        </div>
        <div class="header-timer" id="headerTimer" style="display:none;">0:00.0</div>
        <div class="header-context waiting" id="storyTitle" aria-live="polite">Waiting for story...</div>
    </header>

    <main class="page-content">
        <div class="story-text-container">
            <div class="story-text" id="storyText" aria-live="polite" aria-relevant="additions"></div>
        </div>
    </main>

    <footer class="page-footer">
        <div class="judge-panels" id="judgePanels"></div>
    </footer>

    <div class="outcome" id="outcome" role="alert" aria-live="assertive"></div>
    <div id="qr-overlay" class="qr-overlay"></div>

    <div id="audioOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:2000;display:flex;align-items:center;justify-content:center;cursor:pointer;" onclick="enableAudio()">
        <div style="font-family:'Press Start 2P',cursive;color:#0f0;text-align:center;font-size:var(--text-heading);line-height:1.5;">
            SPECULATIVE IDOL<br><br>
            <span style="font-size:var(--text-caption);opacity:0.7;">Click anywhere to enable audio</span>
        </div>
    </div>

    <script src="lib/qrcode-generator.js"></script>
    <script src="app.js"></script>
    <script src="sounds.js"></script>
    <script>
        const params = getUrlParams();
        const client = new SpecIdolClient();
        let timer = null;
        let tensionMode = false;
        let timerDuration = 120; // default, updated from config
        let connectedJudges = [];  // [{id, name}, ...]

        client.connect();

        client.onConnect = () => {
            client.joinSession(params.code, 'audience');
        };

        client.on('session_state', (data) => {
            if (data.server_time) updateClockOffset(data.server_time);
            if (data.config && data.config.timer_duration) {
                timerDuration = data.config.timer_duration;
            }
            // Populate header stats
            if (data.code) {
                document.getElementById('sessionCode').textContent = data.code;

                // Generate QR code overlay
                const joinURL = window.location.origin + '/index.html#' + data.code;
                const qrElement = createQRElement(joinURL, data.code, 200);
                const overlay = document.getElementById('qr-overlay');
                overlay.innerHTML = '';
                overlay.appendChild(qrElement);

                // Set initial QR visibility
                if (data.audience_qr_visible === false) {
                    overlay.classList.add('hidden');
                }
            }
            // Set initial timer visibility
            if (data.timer_visible === false) {
                document.getElementById('headerTimer').classList.add('timer-force-hidden');
            }
            if (data.stories) {
                document.getElementById('storyCount').textContent = data.stories.length;
            }
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
            // Render judge panels based on connected judges
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                document.getElementById('judgeCount').textContent = connectedJudges.length;
                renderJudgePanels();
            }
            const round = data.current_round;
            if (round.status === 'running' || round.status === 'paused') {
                startRound(round);
                // Replay existing buzzes
                if (round.buzzes) {
                    round.buzzes.forEach(b => markJudgeBuzzed(b.judge_id));
                }
                if (round.status === 'paused') {
                    if (timer) timer.pause();
                }
            } else if (round.status === 'defeat' || round.status === 'victory') {
                startRound(round);
                if (round.buzzes) {
                    round.buzzes.forEach(b => markJudgeBuzzed(b.judge_id));
                }
                if (timer) timer.stop();
                showOutcome(round.status);
            }
        });

        client.on('countdown_start', (data) => {
            resetView();
            const titleEl = document.getElementById('storyTitle');
            titleEl.textContent = data.story_title || 'Untitled';
            titleEl.classList.remove('waiting');

            // Show first paragraph during countdown
            if (data.first_line) {
                appendTextLine(data.first_line);
            }

            // Show header timer (reset to 0)
            const headerTimer = document.getElementById('headerTimer');
            headerTimer.textContent = '0:00.0';
            headerTimer.style.display = 'flex';

            // Start countdown
            const countdown = new Countdown('countdown-container', () => {
                // Countdown complete — start timer (only if round_started hasn't already)
                if (!timer || !timer.intervalId) {
                    timer = new Timer(
                        Infinity,
                        (elapsed) => {
                            document.getElementById('headerTimer').textContent = formatTime(elapsed);
                        }
                    );
                    timer.startTime = Date.now() / 1000;
                    timer.tick();
                    timer.intervalId = setInterval(() => timer.tick(), 100);
                }
            });
            countdown.start();
        });

        client.on('toggle_audience_qr', (data) => {
            const overlay = document.getElementById('qr-overlay');
            if (data.visible) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        });

        client.on('toggle_timer_visibility', (data) => {
            const timerEl = document.getElementById('headerTimer');
            if (data.visible) {
                timerEl.classList.remove('timer-force-hidden');
            } else {
                timerEl.classList.add('timer-force-hidden');
            }
        });

        client.on('round_started', (data) => {
            if (data.server_time) updateClockOffset(data.server_time);

            // Set title if not already set (covers late-joining clients)
            const titleEl = document.getElementById('storyTitle');
            if (titleEl.classList.contains('waiting')) {
                titleEl.textContent = data.title || 'Untitled';
                titleEl.classList.remove('waiting');
            }

            // Show and start server-synced timer (supersedes countdown timer)
            const headerTimer = document.getElementById('headerTimer');
            headerTimer.style.display = 'flex';

            if (timer) timer.stop();
            timer = new Timer(
                Infinity,
                (elapsed) => {
                    document.getElementById('headerTimer').textContent = formatTime(elapsed);
                }
            );
            timer.start(data.start_time || (Date.now() / 1000));
        });

        client.on('paused', (data) => {
            if (timer) timer.pause();
        });

        client.on('resumed', (data) => {
            if (timer) timer.resume(data.timestamp - data.elapsed);
        });

        client.on('text_advanced', (data) => {
            appendTextLine(data.line);
        });

        client.on('buzzed', (data) => {
            markJudgeBuzzed(data.judge_id);

            // Play buzz sound with count progression
            if (typeof playBuzz === 'function' && client.judgeSounds) {
                const soundIndex = client.judgeSounds[data.judge_id];
                if (soundIndex !== undefined) {
                    playBuzz(soundIndex, data.buzz_count || 1);
                }
            }

            // Check if all judges buzzed (final combo)
            if (client.judgeSounds) {
                const totalJudges = connectedJudges.length;
                if (data.buzz_count >= totalJudges && totalJudges > 0) {
                    setTimeout(() => {
                        if (typeof playFinalCombo === 'function') {
                            playFinalCombo(Object.values(client.judgeSounds));
                        }
                    }, 900);
                }
            }
        });

        client.on('round_ended', (data) => {
            if (timer) timer.stop();
            showOutcome(data.outcome);
        });

        client.on('round_reset', () => {
            resetView();
        });

        client.on('shutdown', async (data) => {
            await customAlert(data.message || 'Audience view has been shutdown');
            window.location.href = 'index.html';
        });

        client.on('session_deleted', async (data) => {
            await customAlert(data.message || 'Session has been deleted');
            window.location.href = 'index.html';
        });

        client.on('judge_joined', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                document.getElementById('judgeCount').textContent = connectedJudges.length;
                renderJudgePanels();
            }
        });

        client.on('judge_left', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                document.getElementById('judgeCount').textContent = connectedJudges.length;
                renderJudgePanels();
            }
        });

        client.on('audience_joined', (data) => {
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
        });

        client.on('audience_left', (data) => {
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
        });

        client.on('story_added', (data) => {
            const el = document.getElementById('storyCount');
            el.textContent = (parseInt(el.textContent) || 0) + 1;
        });

        client.on('story_removed', (data) => {
            const el = document.getElementById('storyCount');
            el.textContent = Math.max(0, (parseInt(el.textContent) || 0) - 1);
        });

        client.on('judge_name_changed', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                renderJudgePanels();
            }
        });

        client.on('error', async (data) => {
            if (data.message === 'Invalid session code') {
                await customAlert('Session no longer exists. Returning to home.');
                window.location.href = 'index.html';
            }
        });

        function renderJudgePanels(preserveBuzzed = true) {
            renderJudgePanelCells('judgePanels', connectedJudges, preserveBuzzed);
        }

        function startRound(roundData) {
            resetView();

            const titleEl = document.getElementById('storyTitle');
            titleEl.textContent = roundData.title || 'Untitled';
            titleEl.classList.remove('waiting');
            document.getElementById('storyText').textContent = ''; // Clear - will be populated line by line
        }

        function appendTextLine(line) {
            const textEl = document.getElementById('storyText');

            // Create span for new line with animation class
            const lineSpan = document.createElement('span');
            lineSpan.className = 'text-line';
            lineSpan.textContent = line;

            textEl.appendChild(lineSpan);

            // Add line break after (except for first line)
            if (textEl.children.length > 1) {
                const br = document.createElement('br');
                textEl.insertBefore(br, lineSpan);
            }

            // Scroll new line into view — 'nearest' scrolls minimum amount needed
            setTimeout(() => {
                lineSpan.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function markJudgeBuzzed(judgeId) {
            const cell = document.querySelector(`.judge-cell[data-judge="${judgeId}"]`);
            if (cell) {
                cell.classList.add('buzzed');
            }
        }

        function showOutcome(outcome) {
            stopTensionTicks();
            const outcomeEl = document.getElementById('outcome');
            outcomeEl.textContent = outcome === 'victory' ? 'SURVIVOR!' : 'BUZZED OUT';
            outcomeEl.className = `outcome ${outcome}`;
            outcomeEl.style.display = 'block';

            if (outcome === 'victory') {
                if (typeof playVictoryFanfare === 'function') playVictoryFanfare();
            } else {
                // Defeat: play AHOOGA
                if (typeof playAhooga === 'function') playAhooga();
                document.body.classList.add('defeat-flash');
                setTimeout(() => document.body.classList.remove('defeat-flash'), 500);
            }
        }

        function resetView() {
            stopTensionTicks();
            tensionMode = false;

            // Stop timer
            if (timer) timer.stop();

            document.getElementById('outcome').style.display = 'none';
            document.getElementById('headerTimer').style.display = 'none';
            const titleEl = document.getElementById('storyTitle');
            titleEl.textContent = 'Waiting for story...';
            titleEl.classList.add('waiting');
            document.getElementById('storyText').textContent = '';

            document.querySelectorAll('.judge-cell').forEach(cell => {
                cell.classList.remove('buzzed');
            });
        }

        // Audio overlay: initialize sounds.js AudioContext on user interaction
        async function enableAudio() {
            try { await unlockAudio(); } catch(e) { getAudioContext(); }
            document.getElementById('audioOverlay').style.display = 'none';
        }

        // Tension ticks (use simple tone)
        let tickInterval = null;
        function startTensionTicks() {
            if (tickInterval) clearInterval(tickInterval);
            let tickRate = 1000;
            const tick = () => {
                const ctx = getAudioContext();
                if (ctx) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.frequency.value = 800;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.05);
                }
                tickRate = Math.max(100, tickRate * 0.9);
                tickInterval = setTimeout(tick, tickRate);
            };
            tick();
        }

        function stopTensionTicks() {
            if (tickInterval) {
                clearTimeout(tickInterval);
                tickInterval = null;
            }
        }
    </script>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-buttons">
                <button class="modal-btn" id="modalOk">OK</button>
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="modal.js"></script>
</body>
</html>
