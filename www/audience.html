<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audience - BOURGEOISIE IDOL</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modal.css">
    <script src="openseadragon.min.js"></script>
    <style>
        body {
            position: relative;
        }

        /* CRT scanline effect */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .page-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0 2rem;
        }


        #osdViewerContainer {
            display: none;
            width: 100%;
            flex: 1;
            flex-direction: column;
            position: relative;
        }

        #canvasLabel {
            font-size: var(--text-body);
            color: var(--soviet-gold);
            text-align: center;
            padding: 0.5rem 0;
            display: none;
        }

        #osdViewer {
            width: 100%;
            flex: 1;
            min-height: 200px;
            background: var(--black);
        }

        #textOverlay {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            max-height: 50%;
            overflow-y: auto;
            pointer-events: none;
            z-index: 10;
        }

        #metadataParagraphs {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .text-line {
            display: block;
            opacity: 0;
            transform: translateY(20px);
            animation: lineAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; /* ease-out-expo */
        }

        @keyframes lineAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .outcome {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', cursive;
            font-size: calc(var(--text-display) * 2.5);
            z-index: 100;
            text-align: center;
            line-height: 1.2;
        }

        .outcome.victory {
            color: var(--neon-green);
            text-shadow: 0 0 20px var(--neon-green);
            animation: victoryAnim 1s ease-out;
        }

        .outcome.defeat {
            color: var(--neon-red);
            text-shadow: 0 0 20px var(--neon-red);
            animation: defeatAnim 0.8s ease-out;
        }

        @keyframes victoryAnim {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes defeatAnim {
            0% { transform: translate(-50%, -100vh); opacity: 0; }
            60% { transform: translate(-50%, -40%); opacity: 1; }
            100% { transform: translate(-50%, -50%); }
        }

        body.defeat-flash {
            animation: flashRed 0.5s;
        }

        @keyframes flashRed {
            0%, 100% { background: var(--black); }
            50% { background: #300; }
        }

    </style>
</head>
<body class="page-locked">
    <header class="page-header">
        <div class="header-left">
            <div class="page-label">WATCHING</div>
            <div class="header-info">
                <span id="sessionCode">----</span> |
                <span id="itemCount">0</span> items |
                <span id="judgeCount">0</span> judges |
                <span id="audienceCount">0</span> audience
            </div>
        </div>
        <div class="header-context waiting" id="itemTitle" aria-live="polite">Waiting for item...</div>
    </header>

    <main class="page-content tessellated-bg">
        <div id="osdViewerContainer" class="geometric-frame" style="padding: 1rem;">
            <div id="canvasLabel"></div>
            <div id="osdViewer"></div>
            <div id="textOverlay">
                <div id="metadataParagraphs" aria-live="polite" aria-relevant="additions"></div>
            </div>
        </div>
    </main>

    <footer class="page-footer">
        <div class="judge-panels" id="judgePanels"></div>
    </footer>

    <div class="outcome" id="outcome" role="alert" aria-live="assertive"></div>

    <div id="audioOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:2000;display:flex;align-items:center;justify-content:center;cursor:pointer;" onclick="enableAudio()">
        <div style="font-family:'Press Start 2P',cursive;color:var(--soviet-ochre);text-align:center;font-size:var(--text-heading);line-height:1.5;">
            BOURGEOISIE IDOL<br><br>
            <span style="font-size:var(--text-caption);opacity:0.7;">Click anywhere to enable audio</span>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const params = getUrlParams();
        const client = new SpecIdolClient();
        let timer = null;
        let tensionMode = false;
        let timerDuration = 120; // default, updated from config
        let connectedJudges = [];  // [{id, name}, ...]
        let osdViewer = null;

        // Soviet-themed SVG icons for OSD navigation buttons
        function osdIcon(svg, color = '#d4a574') {
            return 'data:image/svg+xml,' + encodeURIComponent(
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">${svg}</svg>`
            ).replace(/%23/g, '#');
        }

        const OSD_NAV_IMAGES = {
            zoomIn: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#d4a574" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#d4a574" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#d4a574" stroke-width="3"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#d4a574" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#d4a574" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#d4a574" stroke-width="3"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#d4a574" stroke="#d4a574" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#1a1a1a" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#1a1a1a" stroke-width="3"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#b71c1c" stroke="#d4a574" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#fff" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#fff" stroke-width="3"/>')
            },
            zoomOut: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#d4a574" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#d4a574" stroke-width="3"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#d4a574" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#d4a574" stroke-width="3"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#d4a574" stroke="#d4a574" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#1a1a1a" stroke-width="3"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#b71c1c" stroke="#d4a574" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#fff" stroke-width="3"/>')
            },
            home: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#d4a574" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#d4a574" stroke-width="2"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#d4a574" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#d4a574" stroke-width="2"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#d4a574" stroke="#d4a574" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#1a1a1a" stroke-width="2"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#b71c1c" stroke="#d4a574" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#fff" stroke-width="2"/>')
            },
            fullpage: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#d4a574" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#d4a574" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#d4a574" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#d4a574" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#d4a574" stroke-width="2"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#d4a574" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#d4a574" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#d4a574" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#d4a574" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#d4a574" stroke-width="2"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#d4a574" stroke="#d4a574" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#1a1a1a" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#1a1a1a" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#1a1a1a" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#1a1a1a" stroke-width="2"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#b71c1c" stroke="#d4a574" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#fff" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#fff" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#fff" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#fff" stroke-width="2"/>')
            }
        };

        function getTileSource(canvas) {
            if (canvas.service_url) {
                return canvas.service_url + '/info.json';
            }
            return { type: 'image', url: canvas.image_url };
        }

        function initOsdViewer(canvas) {
            destroyOsdViewer();

            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            osdViewer = OpenSeadragon({
                element: document.getElementById('osdViewer'),
                tileSources: getTileSource(canvas),
                showNavigator: false,
                showNavigationControl: true,
                gestureSettingsMouse: { scrollToZoom: true },
                animationTime: prefersReducedMotion ? 0 : 1.2,
                springStiffness: prefersReducedMotion ? 100 : 6.5,
                prefixUrl: '',
                navImages: OSD_NAV_IMAGES
            });
        }

        function destroyOsdViewer() {
            if (osdViewer) {
                osdViewer.destroy();
                osdViewer = null;
            }
        }

        function showCanvasLabel(label) {
            const labelEl = document.getElementById('canvasLabel');
            if (label) {
                labelEl.textContent = label;
                labelEl.style.display = 'block';
            } else {
                labelEl.style.display = 'none';
            }
        }

        client.connect();

        client.onConnect = () => {
            client.joinSession(params.code, 'audience');
        };

        client.on('session_state', (data) => {
            if (data.server_time) updateClockOffset(data.server_time);
            if (data.config && data.config.timer_duration) {
                timerDuration = data.config.timer_duration;
            }
            // Populate header stats
            if (data.code) {
                document.getElementById('sessionCode').textContent = data.code;
            }
            if (data.items) {
                document.getElementById('itemCount').textContent = data.items.length;
            }
            // Render judge panels based on connected judges
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                document.getElementById('judgeCount').textContent = connectedJudges.length;
                renderJudgePanels();
            }
            const round = data.current_round;
            if (round.status === 'running' || round.status === 'paused') {
                startRound(round);
                // Replay existing buzzes
                if (round.buzzes) {
                    round.buzzes.forEach(b => markJudgeBuzzed(b.judge_id));
                }
                if (round.status === 'paused') {
                    if (timer) timer.pause();
                }
            } else if (round.status === 'defeat' || round.status === 'victory') {
                startRound(round);
                if (round.buzzes) {
                    round.buzzes.forEach(b => markJudgeBuzzed(b.judge_id));
                }
                if (timer) timer.stop();
                showOutcome(round.status);
            }
        });

        client.on('round_started', (data) => {
            if (data.server_time) updateClockOffset(data.server_time);
            startRound(data);
        });

        client.on('paused', (data) => {
            if (timer) timer.pause();
        });

        client.on('resumed', (data) => {
            if (timer) timer.resume(data.timestamp - data.elapsed);
        });

        client.on('text_advanced', (data) => {
            appendParagraph(data.paragraph);
        });

        client.on('buzzed', (data) => {
            markJudgeBuzzed(data.judge_id);
            playSound('buzz');
        });

        client.on('round_ended', (data) => {
            if (timer) timer.stop();
            showOutcome(data.outcome);
        });

        client.on('canvas_advanced', (data) => {
            if (data.canvas) {
                showCanvasLabel(data.canvas.label);
                if (osdViewer) {
                    osdViewer.open(getTileSource(data.canvas));
                } else {
                    initOsdViewer(data.canvas);
                }
            }
        });

        client.on('round_reset', () => {
            resetView();
        });

        client.on('shutdown', async (data) => {
            await customAlert(data.message || 'Audience view has been shutdown');
            window.location.href = 'index.html';
        });

        client.on('session_deleted', async (data) => {
            await customAlert(data.message || 'Session has been deleted');
            window.location.href = 'index.html';
        });

        client.on('judge_joined', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                document.getElementById('judgeCount').textContent = connectedJudges.length;
                renderJudgePanels();
            }
        });

        client.on('judge_left', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                document.getElementById('judgeCount').textContent = connectedJudges.length;
                renderJudgePanels();
            }
        });

        client.on('audience_joined', (data) => {
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
        });

        client.on('audience_left', (data) => {
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
        });

        client.on('item_added', (data) => {
            const el = document.getElementById('itemCount');
            el.textContent = (parseInt(el.textContent) || 0) + 1;
        });

        client.on('item_removed', (data) => {
            const el = document.getElementById('itemCount');
            el.textContent = Math.max(0, (parseInt(el.textContent) || 0) - 1);
        });

        client.on('judge_name_changed', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                renderJudgePanels();
            }
        });

        client.on('error', async (data) => {
            if (data.message === 'Invalid session code') {
                await customAlert('Session no longer exists. Returning to home.');
                window.location.href = 'index.html';
            }
        });

        function renderJudgePanels() {
            renderJudgePanelCells('judgePanels', connectedJudges);
        }

        function startRound(roundData) {
            resetView();

            // Header title
            const titleEl = document.getElementById('itemTitle');
            titleEl.textContent = roundData.title || 'Untitled';
            titleEl.classList.remove('waiting');

            // Show OSD viewer if canvases available
            const canvases = roundData.canvases || [];
            const container = document.getElementById('osdViewerContainer');
            if (canvases.length > 0) {
                container.style.display = 'flex';
                const canvasIndex = roundData.canvas_index || 0;
                showCanvasLabel(canvases[canvasIndex].label);
                initOsdViewer(canvases[canvasIndex]);
            } else {
                container.style.display = 'none';
            }

            // Clear metadata paragraphs
            document.getElementById('metadataParagraphs').innerHTML = '';
        }

        function appendParagraph(paragraph) {
            const container = document.getElementById('metadataParagraphs');

            const paraEl = document.createElement('div');
            paraEl.className = 'text-line';
            paraEl.style.padding = '0.75rem 1rem';
            paraEl.style.background = 'rgba(0, 0, 0, 0.8)';
            paraEl.style.border = '1px solid var(--soviet-ochre)';
            paraEl.style.fontSize = '1.4rem';
            paraEl.style.lineHeight = '1.6';
            paraEl.textContent = paragraph;

            container.appendChild(paraEl);

            setTimeout(() => {
                const overlay = document.getElementById('textOverlay');
                overlay.scrollTop = overlay.scrollHeight;
            }, 100);
        }

        function markJudgeBuzzed(judgeId) {
            const cell = document.querySelector(`.judge-cell[data-judge="${judgeId}"]`);
            if (cell) {
                cell.classList.add('buzzed');
            }
        }

        function showOutcome(outcome) {
            stopTensionTicks();
            const outcomeEl = document.getElementById('outcome');
            outcomeEl.textContent = outcome === 'victory' ? 'SURVIVOR!' : 'BUZZED OUT';
            outcomeEl.className = `outcome ${outcome}`;
            outcomeEl.style.display = 'block';

            if (outcome === 'victory') {
                playSound('victory');
                // TODO: confetti/fireworks
            } else {
                playSound('defeat');
                document.body.classList.add('defeat-flash');
                setTimeout(() => document.body.classList.remove('defeat-flash'), 500);
            }
        }

        function resetView() {
            stopTensionTicks();
            tensionMode = false;

            if (timer) timer.stop();
            destroyOsdViewer();

            document.getElementById('outcome').style.display = 'none';
            const titleEl = document.getElementById('itemTitle');
            titleEl.textContent = 'Waiting for item...';
            titleEl.classList.add('waiting');

            document.getElementById('osdViewerContainer').style.display = 'none';
            document.getElementById('canvasLabel').style.display = 'none';
            document.getElementById('metadataParagraphs').innerHTML = '';

            document.querySelectorAll('.judge-cell').forEach(cell => {
                cell.classList.remove('buzzed');
            });
        }

        // Simple tone generator for sound effects
        let audioContext = null;

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        function enableAudio() {
            getAudioContext().resume();
            document.getElementById('audioOverlay').style.display = 'none';
        }

        function playBuzzSound() {
            const oscillator = getAudioContext().createOscillator();
            const gainNode = getAudioContext().createGain();

            oscillator.connect(gainNode);
            gainNode.connect(getAudioContext().destination);

            oscillator.frequency.value = 200; // Low buzzer tone
            oscillator.type = 'sawtooth';

            gainNode.gain.setValueAtTime(0.3, getAudioContext().currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, getAudioContext().currentTime + 0.5);

            oscillator.start(getAudioContext().currentTime);
            oscillator.stop(getAudioContext().currentTime + 0.5);
        }

        function playVictorySound() {
            const times = [0, 0.15, 0.3, 0.5];
            const freqs = [523, 659, 784, 1047]; // C, E, G, C (major chord)

            times.forEach((time, i) => {
                const oscillator = getAudioContext().createOscillator();
                const gainNode = getAudioContext().createGain();

                oscillator.connect(gainNode);
                gainNode.connect(getAudioContext().destination);

                oscillator.frequency.value = freqs[i];
                oscillator.type = 'square';

                gainNode.gain.setValueAtTime(0.2, getAudioContext().currentTime + time);
                gainNode.gain.exponentialRampToValueAtTime(0.01, getAudioContext().currentTime + time + 0.3);

                oscillator.start(getAudioContext().currentTime + time);
                oscillator.stop(getAudioContext().currentTime + time + 0.3);
            });
        }

        function playDefeatSound() {
            const times = [0, 0.2, 0.4];
            const freqs = [440, 349, 262]; // Descending sad trombone

            times.forEach((time, i) => {
                const oscillator = getAudioContext().createOscillator();
                const gainNode = getAudioContext().createGain();

                oscillator.connect(gainNode);
                gainNode.connect(getAudioContext().destination);

                oscillator.frequency.value = freqs[i];
                oscillator.type = 'sawtooth';

                gainNode.gain.setValueAtTime(0.3, getAudioContext().currentTime + time);
                gainNode.gain.exponentialRampToValueAtTime(0.01, getAudioContext().currentTime + time + 0.4);

                oscillator.start(getAudioContext().currentTime + time);
                oscillator.stop(getAudioContext().currentTime + time + 0.4);
            });
        }

        function playTickSound() {
            const oscillator = getAudioContext().createOscillator();
            const gainNode = getAudioContext().createGain();

            oscillator.connect(gainNode);
            gainNode.connect(getAudioContext().destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.1, getAudioContext().currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, getAudioContext().currentTime + 0.05);

            oscillator.start(getAudioContext().currentTime);
            oscillator.stop(getAudioContext().currentTime + 0.05);
        }

        function playSound(type) {
            if (type === 'buzz') playBuzzSound();
            else if (type === 'victory') playVictorySound();
            else if (type === 'defeat') playDefeatSound();
            else if (type === 'tick') playTickSound();
        }

        // Add tick sound in tension mode
        let tickInterval = null;
        function startTensionTicks() {
            if (tickInterval) clearInterval(tickInterval);
            let tickRate = 1000; // Start at 1 second

            const tick = () => {
                playTickSound();
                tickRate = Math.max(100, tickRate * 0.9); // Accelerate
                tickInterval = setTimeout(tick, tickRate);
            };
            tick();
        }

        function stopTensionTicks() {
            if (tickInterval) {
                clearTimeout(tickInterval);
                tickInterval = null;
            }
        }
    </script>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-buttons">
                <button class="modal-btn" id="modalOk">OK</button>
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="modal.js"></script>
</body>
