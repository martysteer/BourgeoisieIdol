<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Audience - BOURGEOISIE IDOL</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modal.css">
    <script src="openseadragon.min.js"></script>
    <style>
        body {
            position: relative;
        }

        /* CRT scanline effect */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }

        .page-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0 2rem;
        }


        .story-text-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .story-text {
            font-size: 2rem;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .text-line {
            display: block;
            opacity: 0;
            transform: translateY(20px);
            animation: lineAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; /* ease-out-expo */
        }

        @keyframes lineAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .outcome {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', cursive;
            font-size: calc(var(--text-display) * 3);
            z-index: 100;
            text-align: center;
            line-height: 1.2;
        }

        .outcome.victory {
            color: var(--neon-green);
            text-shadow: 0 0 20px var(--neon-green);
            animation: victoryAnim 1s ease-out;
        }

        .outcome.defeat {
            color: var(--neon-red);
            text-shadow: 0 0 20px var(--neon-red);
            animation: defeatAnim 0.8s ease-out;
        }

        @keyframes victoryAnim {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes defeatAnim {
            0% { transform: translate(-50%, -100vh); opacity: 0; }
            60% { transform: translate(-50%, -40%); opacity: 1; }
            100% { transform: translate(-50%, -50%); }
        }

        body.defeat-flash {
            animation: flashRed 0.5s;
        }

        @keyframes flashRed {
            0%, 100% { background: var(--black); }
            50% { background: #300; }
        }

        @media (max-width: 900px) {
            .page-content {
                padding: 0 0.5rem;
            }

            .story-text-container {
                padding: 0.5rem;
            }

            .story-text {
                font-size: 1.2rem;
            }

            .outcome {
                font-size: clamp(1.5rem, 8vw, calc(var(--text-display) * 2));
                white-space: nowrap;
            }

            .judge-cell {
                padding: 0.5rem 0.75rem;
            }
        }

        .header-timer.timer-force-hidden {
            display: none !important;
        }

        #osdViewerContainer {
            display: none;
            width: 100%;
            flex: 1;
            flex-direction: column;
            position: relative;
        }

        #canvasLabel {
            font-size: var(--text-body);
            color: var(--neon-yellow);
            text-align: center;
            padding: 0.5rem 0;
            display: none;
        }

        #osdViewer {
            width: 100%;
            flex: 1;
            min-height: 200px;
            background: var(--black);
        }

        #textOverlay {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            max-height: 50%;
            overflow-y: auto;
            pointer-events: none;
            z-index: 10;
        }

        #metadataParagraphs {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .overlay-paragraph {
            background: rgba(0, 0, 0, 0.8);
            padding: 0.75rem 1rem;
            font-size: 1.4rem;
            line-height: 1.6;
            color: #fff;
        }
    </style>
</head>
<body class="page-locked">
    <div id="countdown-container" style="position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:1000;"></div>

    <header class="page-header">
        <div class="header-left">
            <div class="page-label">WATCHING</div>
            <div class="header-info">
                <span id="sessionCode">----</span> |
                <span id="itemCount">0</span> items |
                <span id="judgeCount">0</span> judges |
                <span id="audienceCount">0</span> audience
            </div>
        </div>
        <div class="header-timer" id="headerTimer" style="display:none;">0:00.0</div>
        <div class="header-context waiting" id="itemTitle" aria-live="polite">Waiting for item...</div>
    </header>

    <main class="page-content">
        <div id="osdViewerContainer" style="padding: 1rem;">
            <div id="canvasLabel"></div>
            <div id="osdViewer">
                <div id="osdPlaceholder" style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--neon-green);opacity:0.4;font-size:var(--text-body);text-align:center;">Canvas area</div>
            </div>
            <div id="textOverlay">
                <div id="metadataParagraphs" aria-live="polite" aria-relevant="additions"></div>
            </div>
        </div>
        <div class="story-text-container">
            <div class="story-text" id="storyText" aria-live="polite" aria-relevant="additions"></div>
        </div>
    </main>

    <footer class="page-footer">
        <div class="judge-panels" id="judgePanels"></div>
    </footer>

    <div class="outcome" id="outcome" role="alert" aria-live="assertive"></div>
    <div id="qr-overlay" class="qr-overlay"></div>

    <div id="audioOverlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:2000;display:flex;align-items:center;justify-content:center;cursor:pointer;" onclick="enableAudio()">
        <div style="font-family:'Press Start 2P',cursive;color:#0f0;text-align:center;font-size:var(--text-heading);line-height:1.5;">
            BOURGEOISIE IDOL<br><br>
            <span style="font-size:var(--text-caption);opacity:0.7;">Click anywhere to enable audio</span>
        </div>
    </div>

    <script src="lib/qrcode-generator.js"></script>
    <script src="app.js"></script>
    <script src="sounds.js"></script>
    <script>
        const params = getUrlParams();
        const client = new SpecIdolClient();
        let timer = null;
        let tensionMode = false;
        let timerDuration = 120; // default, updated from config
        let connectedJudges = [];  // [{id, name}, ...]

        let osdViewer = null;
        let canvasMode = false;

        function osdIcon(svg, color = '#0f0') {
            return 'data:image/svg+xml,' + encodeURIComponent(
                `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">${svg}</svg>`
            );
        }

        const OSD_NAV_IMAGES = {
            zoomIn: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#0f0" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#0f0" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#0f0" stroke-width="3"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#0f0" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#0f0" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#0f0" stroke-width="3"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#0f0" stroke="#0f0" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#1a1a1a" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#1a1a1a" stroke-width="3"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#f00" stroke="#0f0" stroke-width="2"/><line x1="18" y1="10" x2="18" y2="26" stroke="#fff" stroke-width="3"/><line x1="10" y1="18" x2="26" y2="18" stroke="#fff" stroke-width="3"/>')
            },
            zoomOut: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#0f0" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#0f0" stroke-width="3"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#0f0" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#0f0" stroke-width="3"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#0f0" stroke="#0f0" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#1a1a1a" stroke-width="3"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#f00" stroke="#0f0" stroke-width="2"/><line x1="10" y1="18" x2="26" y2="18" stroke="#fff" stroke-width="3"/>')
            },
            home: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#0f0" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#0f0" stroke-width="2"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#0f0" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#0f0" stroke-width="2"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#0f0" stroke="#0f0" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#1a1a1a" stroke-width="2"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#f00" stroke="#0f0" stroke-width="2"/><polygon points="18,6 30,18 24,18 24,30 12,30 12,18 6,18" fill="none" stroke="#fff" stroke-width="2"/>')
            },
            fullpage: {
                REST:  osdIcon('<rect rx="4" width="36" height="36" fill="#1a1a1a" stroke="#0f0" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#0f0" stroke-width="2"/>'),
                GROUP: osdIcon('<rect rx="4" width="36" height="36" fill="#2a2a2a" stroke="#0f0" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#0f0" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#0f0" stroke-width="2"/>'),
                HOVER: osdIcon('<rect rx="4" width="36" height="36" fill="#0f0" stroke="#0f0" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#1a1a1a" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#1a1a1a" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#1a1a1a" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#1a1a1a" stroke-width="2"/>'),
                DOWN:  osdIcon('<rect rx="4" width="36" height="36" fill="#f00" stroke="#0f0" stroke-width="2"/><polyline points="10,14 10,10 14,10" fill="none" stroke="#fff" stroke-width="2"/><polyline points="22,10 26,10 26,14" fill="none" stroke="#fff" stroke-width="2"/><polyline points="26,22 26,26 22,26" fill="none" stroke="#fff" stroke-width="2"/><polyline points="14,26 10,26 10,22" fill="none" stroke="#fff" stroke-width="2"/>')
            }
        };

        function getTileSource(canvas) {
            if (canvas.service_url) {
                return canvas.service_url + '/info.json';
            }
            return { type: 'image', url: canvas.image_url };
        }

        function initOsdViewer(canvas) {
            destroyOsdViewer();
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            osdViewer = OpenSeadragon({
                element: document.getElementById('osdViewer'),
                tileSources: getTileSource(canvas),
                showNavigator: false,
                showNavigationControl: true,
                gestureSettingsMouse: { scrollToZoom: true },
                animationTime: prefersReducedMotion ? 0 : 1.2,
                springStiffness: prefersReducedMotion ? 100 : 6.5,
                prefixUrl: '',
                navImages: OSD_NAV_IMAGES
            });
        }

        function destroyOsdViewer() {
            if (osdViewer) {
                osdViewer.destroy();
                osdViewer = null;
            }
        }

        function showCanvasLabel(label) {
            const labelEl = document.getElementById('canvasLabel');
            if (label) {
                labelEl.textContent = label;
                labelEl.style.display = 'block';
            } else {
                labelEl.style.display = 'none';
            }
        }

        client.connect();

        client.onConnect = () => {
            client.joinSession(params.code, 'audience');
        };

        client.on('session_state', (data) => {
            if (data.server_time) updateClockOffset(data.server_time);
            if (data.config && data.config.timer_duration) {
                timerDuration = data.config.timer_duration;
            }
            // Populate header stats
            if (data.code) {
                document.getElementById('sessionCode').textContent = data.code;

                // Generate QR code overlay
                const joinURL = window.location.origin + '/index.html#' + data.code;
                const qrElement = createQRElement(joinURL, data.code, 200);
                const overlay = document.getElementById('qr-overlay');
                overlay.innerHTML = '';
                overlay.appendChild(qrElement);

                // Set initial QR visibility
                if (data.audience_qr_visible === false) {
                    overlay.classList.add('hidden');
                }
            }
            // Set initial timer visibility
            if (data.timer_visible === false) {
                document.getElementById('headerTimer').classList.add('timer-force-hidden');
            }
            // Set initial canvas mode
            if (data.canvas_visible === true) {
                canvasMode = true;
            }
            if (data.items) {
                document.getElementById('itemCount').textContent = data.items.length;
            }
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
            // Render judge panels based on connected judges
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                document.getElementById('judgeCount').textContent = connectedJudges.length;
                renderJudgePanels();
            }
            const round = data.current_round;
            if (round.status === 'running' || round.status === 'paused') {
                startRound(round);
                // Replay existing buzzes
                if (round.buzzes) {
                    round.buzzes.forEach(b => markJudgeBuzzed(b.judge_id));
                }
                if (round.status === 'paused') {
                    if (timer) timer.pause();
                }
            } else if (round.status === 'defeat' || round.status === 'victory') {
                startRound(round);
                if (round.buzzes) {
                    round.buzzes.forEach(b => markJudgeBuzzed(b.judge_id));
                }
                if (timer) timer.stop();
                showOutcome(round.status);
            }
        });

        client.on('countdown_start', (data) => {
            resetView();
            const titleEl = document.getElementById('itemTitle');
            titleEl.textContent = data.item_title || 'Untitled';
            titleEl.classList.remove('waiting');

            // Init OSD if canvases present
            const hasCanvases = data.canvases && data.canvases.length > 0;
            if (hasCanvases) {
                const canvas = data.canvases[0];
                if (canvas) {
                    initOsdViewer(canvas);
                    showCanvasLabel(canvas.label);
                }
            }
            applyCanvasMode();

            // Show first paragraph in correct container
            if (data.first_paragraph || data.first_line) {
                const text = data.first_paragraph || data.first_line;
                if (canvasMode && osdViewer) {
                    appendOverlayParagraph(text);
                } else {
                    appendTextLine(text);
                }
            }

            // Show header timer (reset to 0)
            const headerTimer = document.getElementById('headerTimer');
            headerTimer.textContent = '0:00.0';
            headerTimer.style.display = 'flex';

            // Start countdown
            const countdown = new Countdown('countdown-container', () => {
                // Countdown complete — start timer (only if round_started hasn't already)
                if (!timer || !timer.intervalId) {
                    timer = new Timer(
                        Infinity,
                        (elapsed) => {
                            document.getElementById('headerTimer').textContent = formatTime(elapsed);
                        }
                    );
                    timer.startTime = Date.now() / 1000;
                    timer.tick();
                    timer.intervalId = setInterval(() => timer.tick(), 100);
                }
            });
            countdown.start();
        });

        client.on('toggle_audience_qr', (data) => {
            const overlay = document.getElementById('qr-overlay');
            if (data.visible) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        });

        client.on('toggle_timer_visibility', (data) => {
            const timerEl = document.getElementById('headerTimer');
            if (data.visible) {
                timerEl.classList.remove('timer-force-hidden');
            } else {
                timerEl.classList.add('timer-force-hidden');
            }
        });

        client.on('toggle_canvas', (data) => {
            canvasMode = data.visible;
            applyCanvasMode();
        });

        client.on('round_started', (data) => {
            if (data.server_time) updateClockOffset(data.server_time);

            // Set title if not already set (covers late-joining clients)
            const titleEl = document.getElementById('itemTitle');
            if (titleEl.classList.contains('waiting')) {
                titleEl.textContent = data.title || 'Untitled';
                titleEl.classList.remove('waiting');
            }

            // Show and start server-synced timer (supersedes countdown timer)
            const headerTimer = document.getElementById('headerTimer');
            headerTimer.style.display = 'flex';

            if (timer) timer.stop();
            timer = new Timer(
                Infinity,
                (elapsed) => {
                    document.getElementById('headerTimer').textContent = formatTime(elapsed);
                }
            );
            timer.start(data.start_time || (Date.now() / 1000));
        });

        client.on('paused', (data) => {
            if (timer) timer.pause();
        });

        client.on('resumed', (data) => {
            if (timer) timer.resume(data.timestamp - data.elapsed);
        });

        client.on('text_advanced', (data) => {
            const text = data.paragraph || data.line;
            if (canvasMode) {
                appendOverlayParagraph(text);
            } else {
                appendTextLine(text);
            }
        });

        client.on('canvas_advanced', (data) => {
            if (data.canvas) {
                showCanvasLabel(data.canvas.label);
                if (osdViewer) {
                    osdViewer.open(getTileSource(data.canvas));
                } else {
                    initOsdViewer(data.canvas);
                }
            }
        });

        client.on('buzzed', (data) => {
            markJudgeBuzzed(data.judge_id);

            // Play buzz sound with count progression
            if (typeof playBuzz === 'function' && client.judgeSounds) {
                const soundIndex = client.judgeSounds[data.judge_id];
                if (soundIndex !== undefined) {
                    playBuzz(soundIndex, data.buzz_count || 1);
                }
            }

            // Check if all judges buzzed (final combo)
            if (client.judgeSounds) {
                const totalJudges = connectedJudges.length;
                if (data.buzz_count >= totalJudges && totalJudges > 0) {
                    setTimeout(() => {
                        if (typeof playFinalCombo === 'function') {
                            playFinalCombo(Object.values(client.judgeSounds));
                        }
                    }, 900);
                }
            }
        });

        client.on('round_ended', (data) => {
            if (timer) timer.stop();
            showOutcome(data.outcome);
        });

        client.on('round_reset', () => {
            resetView();
        });

        client.on('shutdown', async (data) => {
            await customAlert(data.message || 'Audience view has been shutdown');
            window.location.href = 'index.html';
        });

        client.on('session_deleted', async (data) => {
            await customAlert(data.message || 'Session has been deleted');
            window.location.href = 'index.html';
        });

        client.on('judge_joined', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                document.getElementById('judgeCount').textContent = connectedJudges.length;
                renderJudgePanels();
            }
        });

        client.on('judge_left', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                document.getElementById('judgeCount').textContent = connectedJudges.length;
                renderJudgePanels();
            }
        });

        client.on('audience_joined', (data) => {
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
        });

        client.on('audience_left', (data) => {
            if (data.audience_count !== undefined) {
                document.getElementById('audienceCount').textContent = data.audience_count;
            }
        });

        client.on('item_added', (data) => {
            const el = document.getElementById('itemCount');
            el.textContent = (parseInt(el.textContent) || 0) + 1;
        });

        client.on('item_removed', (data) => {
            const el = document.getElementById('itemCount');
            el.textContent = Math.max(0, (parseInt(el.textContent) || 0) - 1);
        });

        client.on('judge_name_changed', (data) => {
            if (data.connected_judges) {
                connectedJudges = data.connected_judges;
                renderJudgePanels();
            }
        });

        client.on('error', async (data) => {
            if (data.message === 'Invalid session code') {
                await customAlert('Session no longer exists. Returning to home.');
                window.location.href = 'index.html';
            }
        });

        function renderJudgePanels(preserveBuzzed = true) {
            renderJudgePanelCells('judgePanels', connectedJudges, preserveBuzzed);
        }

        function startRound(roundData) {
            resetView();

            const titleEl = document.getElementById('itemTitle');
            titleEl.textContent = roundData.title || 'Untitled';
            titleEl.classList.remove('waiting');
            document.getElementById('storyText').textContent = '';

            // Init OSD viewer if canvases present
            const hasCanvases = roundData.canvases && roundData.canvases.length > 0;
            if (hasCanvases) {
                const canvas = roundData.canvases[roundData.canvas_index || 0];
                if (canvas) {
                    initOsdViewer(canvas);
                    showCanvasLabel(canvas.label);
                }
            }
            applyCanvasMode();
        }

        function appendTextLine(line) {
            const textEl = document.getElementById('storyText');

            // Create span for new line with animation class
            const lineSpan = document.createElement('span');
            lineSpan.className = 'text-line';
            lineSpan.textContent = line;

            textEl.appendChild(lineSpan);

            // Add line break after (except for first line)
            if (textEl.children.length > 1) {
                const br = document.createElement('br');
                textEl.insertBefore(br, lineSpan);
            }

            // Scroll new line into view — 'nearest' scrolls minimum amount needed
            setTimeout(() => {
                lineSpan.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function appendOverlayParagraph(text) {
            const container = document.getElementById('metadataParagraphs');
            const div = document.createElement('div');
            div.className = 'overlay-paragraph text-line';
            div.textContent = text;
            container.appendChild(div);

            const overlay = document.getElementById('textOverlay');
            setTimeout(() => {
                overlay.scrollTop = overlay.scrollHeight;
            }, 100);
        }

        function applyCanvasMode() {
            const osdContainer = document.getElementById('osdViewerContainer');
            const textContainer = document.querySelector('.story-text-container');
            const placeholder = document.getElementById('osdPlaceholder');

            if (canvasMode) {
                osdContainer.style.display = 'flex';
                textContainer.style.display = 'none';
                if (placeholder) placeholder.style.display = osdViewer ? 'none' : 'flex';
            } else {
                osdContainer.style.display = 'none';
                textContainer.style.display = '';
            }
        }

        function markJudgeBuzzed(judgeId) {
            const cell = document.querySelector(`.judge-cell[data-judge="${judgeId}"]`);
            if (cell) {
                cell.classList.add('buzzed');
            }
        }

        function showOutcome(outcome) {
            stopTensionTicks();
            const outcomeEl = document.getElementById('outcome');
            outcomeEl.textContent = outcome === 'victory' ? 'SURVIVOR!' : 'BUZZED OUT';
            outcomeEl.className = `outcome ${outcome}`;
            outcomeEl.style.display = 'block';

            if (outcome === 'victory') {
                if (typeof playVictoryFanfare === 'function') playVictoryFanfare();
            } else {
                // Defeat: play AHOOGA
                if (typeof playAhooga === 'function') playAhooga();
                document.body.classList.add('defeat-flash');
                setTimeout(() => document.body.classList.remove('defeat-flash'), 500);
            }
        }

        function resetView() {
            stopTensionTicks();
            tensionMode = false;
            canvasMode = false;

            // Stop timer
            if (timer) timer.stop();

            // Destroy OSD viewer
            destroyOsdViewer();
            document.getElementById('osdViewerContainer').style.display = 'none';
            document.getElementById('canvasLabel').style.display = 'none';
            document.getElementById('metadataParagraphs').innerHTML = '';

            // Restore text container
            document.querySelector('.story-text-container').style.display = '';

            document.getElementById('outcome').style.display = 'none';
            document.getElementById('headerTimer').style.display = 'none';
            const titleEl = document.getElementById('itemTitle');
            titleEl.textContent = 'Waiting for item...';
            titleEl.classList.add('waiting');
            document.getElementById('storyText').textContent = '';

            document.querySelectorAll('.judge-cell').forEach(cell => {
                cell.classList.remove('buzzed');
            });
        }

        // Audio overlay: initialize sounds.js AudioContext on user interaction
        async function enableAudio() {
            try { await unlockAudio(); } catch(e) { getAudioContext(); }
            document.getElementById('audioOverlay').style.display = 'none';
        }

        // Tension ticks (use simple tone)
        let tickInterval = null;
        function startTensionTicks() {
            if (tickInterval) clearInterval(tickInterval);
            let tickRate = 1000;
            const tick = () => {
                const ctx = getAudioContext();
                if (ctx) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.frequency.value = 800;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.05);
                }
                tickRate = Math.max(100, tickRate * 0.9);
                tickInterval = setTimeout(tick, tickRate);
            };
            tick();
        }

        function stopTensionTicks() {
            if (tickInterval) {
                clearTimeout(tickInterval);
                tickInterval = null;
            }
        }
    </script>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-message" id="modalMessage"></div>
            <div class="modal-buttons">
                <button class="modal-btn" id="modalOk">OK</button>
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="modal.js"></script>
</body>
</html>
