<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judge Testing Dashboard - SPECULATIVE IDOL</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            padding: 2rem;
            overflow-y: auto;
        }

        .warning {
            background: var(--neon-red);
            color: var(--black);
            padding: 1rem;
            margin-bottom: 2rem;
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-body);
            line-height: 1.6;
        }

        .setup {
            margin-bottom: 2rem;
            padding: 1.5rem;
            border: 2px solid var(--neon-yellow);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
        }

        .setup label {
            font-size: var(--text-body);
        }

        .setup input[type="text"] {
            text-transform: uppercase;
            font-family: 'Press Start 2P', cursive;
            font-size: var(--text-body);
            text-align: center;
            letter-spacing: 0.3rem;
            width: 8rem;
        }

        .setup input[type="number"] {
            width: 4rem;
            text-align: center;
        }

        .judge-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .judge-panel {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--neon-green);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .judge-panel.disconnected {
            border-color: #333;
            opacity: 0.5;
        }

        .judge-panel.buzzed {
            border-color: var(--neon-red);
        }

        .judge-panel h3 {
            color: var(--neon-green);
            font-size: var(--text-subheading);
        }

        .judge-panel .status {
            font-size: var(--text-caption);
        }

        .judge-panel .status.connected {
            color: var(--neon-green);
        }

        .judge-panel .status.disconnected {
            color: var(--neon-red);
        }

        .judge-panel .sound-info {
            font-size: var(--text-caption);
            opacity: 0.7;
        }

        .btn-buzz {
            background: var(--neon-red);
            color: var(--black);
            border-color: var(--neon-red);
            padding: 1rem;
            margin-top: 0.5rem;
        }

        .btn-buzz:hover:not(:disabled) {
            background: var(--black);
            color: var(--neon-red);
            box-shadow: 0 0 20px var(--neon-red);
        }

        .btn-connect {
            background: var(--neon-green);
            color: var(--black);
            border-color: var(--neon-green);
        }

        .btn-disconnect {
            background: var(--black);
            color: var(--neon-red);
            border-color: var(--neon-red);
        }

        .btn-disconnect:hover:not(:disabled) {
            background: var(--neon-red);
            color: var(--black);
        }

        .log {
            margin-top: 2rem;
            padding: 1rem;
            border: 1px solid var(--neon-green);
            max-height: 200px;
            overflow-y: auto;
            font-size: var(--text-caption);
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="warning">TESTING DASHBOARD — For testing only. Do not use during live events.</div>

    <div class="setup">
        <label>Session code:</label>
        <input type="text" id="sessionCode" placeholder="XKRM" maxlength="4">
        <label>Judges:</label>
        <input type="number" id="judgeCount" min="1" max="10" value="3">
        <button class="btn-connect" onclick="connectAll()">Connect All</button>
        <button class="btn-disconnect" onclick="disconnectAll()">Disconnect All</button>
    </div>

    <div id="judgeGrid" class="judge-grid"></div>

    <div class="log" id="log"></div>

    <script src="sounds.js"></script>
    <script src="app.js"></script>
    <script>
        const judges = [];

        function log(msg) {
            const logEl = document.getElementById('log');
            const line = document.createElement('div');
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function connectAll() {
            const code = document.getElementById('sessionCode').value.trim().toUpperCase();
            if (!code) {
                log('ERROR: Enter a session code');
                return;
            }

            const count = parseInt(document.getElementById('judgeCount').value) || 3;

            // Disconnect existing
            disconnectAll();

            // Create judges
            for (let i = 1; i <= count; i++) {
                const judge = {
                    id: null,
                    name: `Test Judge ${i}`,
                    client: new SpecIdolClient(),
                    soundIndex: null,
                    connected: false,
                    buzzed: false
                };

                judge.client.onConnect = () => {
                    judge.connected = true;
                    log(`${judge.name}: WebSocket connected, joining session ${code}...`);
                    judge.client.joinSession(code, 'judge', null, judge.name);
                };

                judge.client.on('session_state', (data) => {
                    judge.id = data.client_info ? data.client_info.judge_id : null;
                    if (data.judge_sounds && judge.id !== null) {
                        judge.soundIndex = data.judge_sounds[judge.id];
                    }
                    log(`${judge.name}: Joined as judge #${judge.id} (sound: ${judge.soundIndex})`);
                    renderJudges();
                });

                judge.client.on('countdown_start', (data) => {
                    judge.buzzed = false;
                    log(`${judge.name}: Countdown started`);
                    renderJudges();
                });

                judge.client.on('round_started', (data) => {
                    log(`${judge.name}: Round started`);
                });

                judge.client.on('buzzed', (data) => {
                    if (data.judge_id === judge.id) {
                        judge.buzzed = true;
                        renderJudges();
                    }
                    // Play sound
                    if (judge.client.judgeSounds) {
                        const si = judge.client.judgeSounds[data.judge_id];
                        if (si !== undefined) {
                            playBuzz(si, data.buzz_count || 1);
                        }
                    }
                    log(`${judge.name}: Judge #${data.judge_id} buzzed (count: ${data.buzz_count})`);
                });

                judge.client.on('round_ended', (data) => {
                    judge.buzzed = false;
                    log(`${judge.name}: Round ended (${data.outcome})`);
                    renderJudges();
                });

                judge.client.on('round_reset', () => {
                    judge.buzzed = false;
                    log(`${judge.name}: Round reset`);
                    renderJudges();
                });

                judge.client.on('error', (data) => {
                    log(`${judge.name}: ERROR — ${data.message}`);
                });

                judges.push(judge);
                judge.client.connect();
            }

            renderJudges();
        }

        function disconnectAll() {
            judges.forEach(j => {
                if (j.client.ws) {
                    j.client.ws.close();
                    j.connected = false;
                }
            });
            judges.length = 0;
            renderJudges();
            log('All judges disconnected');
        }

        function buzzJudge(index) {
            const judge = judges[index];
            if (!judge || !judge.connected || judge.buzzed) return;
            judge.buzzed = true;
            renderJudges();
            judge.client.buzz(judge.id);
            log(`${judge.name}: Buzzing...`);
        }

        function renderJudges() {
            const grid = document.getElementById('judgeGrid');
            grid.innerHTML = '';

            judges.forEach((judge, index) => {
                const panel = document.createElement('div');
                panel.className = 'judge-panel';
                if (!judge.connected) panel.classList.add('disconnected');
                if (judge.buzzed) panel.classList.add('buzzed');

                panel.innerHTML = `
                    <h3>${escapeHtml(judge.name)}</h3>
                    <div class="status ${judge.connected ? 'connected' : 'disconnected'}">
                        ${judge.connected ? '● Connected' : '○ Disconnected'}
                        ${judge.id !== null ? ` (Judge #${judge.id})` : ''}
                    </div>
                    <div class="sound-info">Buzz sound: ${judge.soundIndex !== null ? judge.soundIndex : 'N/A'}</div>
                    <button class="btn-buzz" onclick="buzzJudge(${index})" ${!judge.connected || judge.buzzed ? 'disabled' : ''}>
                        ${judge.buzzed ? 'BUZZED' : 'BUZZ'}
                    </button>
                `;

                grid.appendChild(panel);
            });
        }

        renderJudges();
        log('Judge testing dashboard ready. Enter session code and click Connect All.');
    </script>
</body>
</html>
